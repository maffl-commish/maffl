<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MAFFL HQ · Lab</title>
<link rel="icon" href="../maffl-logo.png">
<link rel="apple-touch-icon" href="../maffl-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  MAFFL HQ app — PROTOTYPE v0 (lab). Read-only, real data, not linked from the site.
  Design: _ops/docs/APP_DESIGN.md. Reads: ../weekly.html (latest WEEKS object, at runtime),
  ../schedule-data.js, ../matchups-data.js, ../key-dates-data.js. Writes nothing.
  Identity is "pick your team" (stored on this phone) until passphrases are connected.
-->
<style>
  :root{--surface:#fff;--page-bg:#f8f9fb;--navy:#1a2e50;--navy-soft:rgba(26,46,80,.07);--navy-shadow:rgba(26,46,80,.10);
    --gold:#f5a623;--gold-dark:#d98e10;--gold-soft:#fffaf0;--muted:#8a9ab5;--ink2:#4a5a78;--border:#e2e6ed;--win:#1d9e75;--loss:#c04a4a;
    --display:"Barlow Condensed",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  /* iPhone: no double-tap zoom, no font inflation; only #views (and the sideways rows) ever scroll */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:var(--page-bg);color:var(--navy);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  body{position:fixed;inset:0}
  .app{max-width:480px;margin:0 auto;height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden}
  .keys,.wkchips,.rings,.tgrid2,.dbody,.sb,.cbox,.welcome{overscroll-behavior:contain}
  input,select,textarea{font-size:16px}
  #views{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .view{display:none}.view.on{display:block}
  .hdr{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);z-index:20;padding-top:env(safe-area-inset-top)}
  .hdr-in{display:flex;align-items:center;gap:8px;padding:8px 14px}
  .hdr img{height:36px;width:36px}
  .hdr .t{font:700 22px var(--display)}
  .hdr .wk{margin-left:auto;font:600 12px var(--body);color:var(--muted);text-align:right;line-height:1.2}
  .hdr .wk b{display:block;color:var(--navy);font:700 14px var(--display);text-transform:uppercase;letter-spacing:.04em}
  .chip{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 13px var(--display)}
  .lab{background:var(--gold);color:var(--navy);font:700 10px var(--display);letter-spacing:.12em;text-align:center;padding:2px 0;text-transform:uppercase}
  .sh{padding:16px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .sh h2{font:700 13px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .sh a,.sh small{font:600 12px var(--body);color:var(--gold-dark)}
  .pad{padding:0 14px}
  .rings{display:flex;gap:14px;overflow-x:auto;padding:4px 14px 4px;scrollbar-width:none}
  .rings::-webkit-scrollbar{display:none}
  .ring{flex:0 0 auto;width:62px;text-align:center;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.05em}
  .ring i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 5px;border-radius:50%;font-style:normal;font-size:25px;background:var(--surface);box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--page-bg)}
  .ring.seen{color:var(--muted)}.ring.seen i{box-shadow:0 0 0 2px var(--border),0 0 0 4px var(--page-bg)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;box-shadow:0 1px 3px var(--navy-shadow)}
  .card.navy{background:linear-gradient(135deg,#243a62,#1a2e50 55%,#0f1d34);color:#fff;border:0;border-left:4px solid var(--gold)}
  .card.soon{border-style:dashed;box-shadow:none;background:transparent}
  .card.soon .eb{color:var(--muted)}
  .eb{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--gold-dark)}
  .navy .eb{color:var(--gold)}
  .card h3{font:700 21px/1.1 var(--display);margin:4px 0 6px}
  .card p,.p{font-size:14px;line-height:1.45;color:var(--ink2)}
  .navy p{color:#c8d2e4}
  .btns{display:flex;gap:8px;margin-top:12px}
  .b{flex:1;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.05em;border-radius:8px;padding:11px 6px;border:1px solid var(--border);background:var(--surface);color:var(--navy);text-align:center;display:block}
  .b.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navy .b{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
  .navy .b.pri{background:var(--gold);color:var(--navy);border-color:var(--gold)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:0}
  .nm{font:700 17px/1.15 var(--display)}
  .meta{font-size:12px;color:var(--muted);line-height:1.35}
  .rt{margin-left:auto;text-align:right;font:700 17px var(--display);white-space:nowrap}
  .rt small{display:block;font:500 11px var(--body);color:var(--muted)}
  .w{color:var(--win)}.l{color:var(--loss)}
  .rv{display:inline-block;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--gold-dark)}
  .mini{border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:12px;margin-left:6px;flex:0 0 auto}
  .mini.sel,.reacts button.sel{background:var(--gold);border-color:var(--gold)}
  .reacts{display:flex;gap:6px}
  .reacts button{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:18px}
  .grp{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:14px 0 2px}
  .pill{display:inline-block;font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--navy-soft);color:var(--ink2)}
  .pill.gold{background:var(--gold);color:var(--navy)}
  /* match */
  .mhero{background:linear-gradient(135deg,#243a62,#1a2e50 55%,#0f1d34);color:#fff;border-radius:14px;padding:16px;margin-top:12px}
  .vs{display:flex;align-items:flex-start;text-align:center;margin-top:12px}
  .vs>div{flex:1;min-width:0}
  .av{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 18px var(--display);background:var(--gold);color:var(--navy)}
  .av.opp{background:#fff}
  .vs .tn{font:700 17px/1.1 var(--display)}
  .vs .rec{font-size:12px;color:#c8d2e4;margin-top:2px}
  .vs .mid{flex:0 0 36px;font:700 14px var(--display);color:var(--gold);padding-top:18px}
  .stakes{margin-top:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px;font-size:13px;color:#c8d2e4;line-height:1.55}
  .dots{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .dots i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--display);font-style:normal;color:#fff}
  .dots .W{background:var(--win)}.dots .L{background:var(--loss)}
  .stat3{display:flex;margin-top:8px;text-align:center}
  .stat3>div{flex:1}.stat3 b{display:block;font:700 24px var(--display)}.stat3 small{font-size:11px;color:var(--muted)}
  .meter{height:8px;border-radius:4px;background:var(--navy-soft);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--gold)}
  .game{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:8px}
  .game.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .game .ln{display:flex;justify-content:space-between;gap:8px;font:600 14px/1.55 var(--body)}
  .game .ln b{font:700 16px var(--display)}
  .game .ln.won{font-weight:700}
  .gfoot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
  .flag{font:700 10px var(--display);letter-spacing:.08em;color:var(--gold-dark);text-transform:uppercase}
  /* team */
  .thero{background:var(--surface);border-bottom:1px solid var(--border);padding:14px}
  .thero .tn{font:700 26px/1 var(--display)}
  .thero .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .kpis{display:flex;gap:8px;margin-top:12px}
  .kpi{flex:1;background:var(--page-bg);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center}
  .kpi b{display:block;font:700 20px var(--display)}.kpi small{font-size:11px;color:var(--muted)}
  .seg{display:flex;background:var(--navy-soft);border-radius:10px;padding:3px;margin:12px 14px 0}
  .seg button{flex:1;min-width:0;padding:8px 0;border-radius:8px;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px var(--navy-shadow)}
  .sub-v{display:none}.sub-v.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:6px 4px}
  td{padding:9px 4px;border-top:1px solid var(--border)}
  td.n,th.n{text-align:right;white-space:nowrap}
  tr.me td{background:rgba(245,166,35,.13);font-weight:700}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;display:block}
  .tile span{font-size:24px}.tile b{display:block;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .tile small{font-size:11px;color:var(--muted)}
  .list a,.list button{display:flex;width:100%;align-items:center;gap:12px;padding:14px;background:var(--surface);border-bottom:1px solid var(--border);font:700 16px var(--display);text-transform:uppercase;letter-spacing:.04em;text-align:left}
  .list a::after,.list button::after{content:"›";margin-left:auto;color:var(--muted);font-size:22px}
  .list span{font-size:20px}
  nav.tabs{flex:0 0 auto;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  nav.tabs button span{font-size:21px;filter:grayscale(1);opacity:.55}
  nav.tabs button.on{color:var(--navy)}
  nav.tabs button.on span{filter:none;opacity:1}
  nav.tabs button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--gold)}
  .pastbar{display:none;align-items:center;gap:8px;background:var(--navy);color:#fff;font:600 12px var(--body);padding:6px 14px}
  .pastbar button{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:6px;padding:4px 8px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em}
  .wkchips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 4px;scrollbar-width:none}
  .wkchips::-webkit-scrollbar{display:none}
  .wkchips button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px;font:700 13px var(--display);letter-spacing:.04em}
  .wkchips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rbody{font-size:14px;line-height:1.5;color:var(--ink2)}
  .rbody ul,.rbody ol{padding-left:18px;margin:6px 0}.rbody li{margin:4px 0}
  .rbody h3,.rbody h4{font:700 16px var(--display);color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
  .rbody p{margin:6px 0}.rbody strong{color:var(--navy)}
  .rbody table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;display:block;overflow-x:auto}
  .rbody th,.rbody td{border-top:1px solid var(--border);padding:6px 4px;text-align:left;vertical-align:top}
  .rbody .rule-tag{font:700 9px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold-dark);border:1px solid var(--gold);border-radius:3px;padding:1px 4px;margin-left:4px;white-space:nowrap}
  .rbody mark{background:rgba(245,166,35,.35)}
  .money{font-variant-numeric:tabular-nums}
  .opt{position:relative;display:flex;align-items:center;gap:8px;width:100%;margin-top:7px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;overflow:hidden;font:600 14px var(--body)}
  .opt .ob{position:absolute;left:0;top:0;bottom:0;background:rgba(245,166,35,.18)}
  .opt .ol,.opt .op{position:relative}.opt .op{margin-left:auto;font:700 14px var(--display);color:var(--ink2)}
  .opt small{color:var(--muted);font-weight:500}
  .opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
  .pinpad{font:700 26px var(--display);letter-spacing:.06em;text-align:center;text-transform:uppercase}
  .pos{display:inline-grid;place-items:center;min-width:34px;font:700 12px var(--display);border-radius:4px;padding:2px 4px;color:#fff;background:#6b778d;flex:0 0 auto}
  .pos.p-QB{background:#7a3e9d}.pos.p-RB{background:var(--win)}.pos.p-WR{background:#3b6fb6}.pos.p-TE{background:#c46a1b}.pos.p-CR{background:var(--gold);color:var(--navy)}
  .pos.big{min-width:54px;height:54px;font-size:18px;border-radius:12px}
  .tb{font:700 9px var(--display);letter-spacing:.1em;background:var(--gold);color:var(--navy);padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:2px}
  .prow{width:100%}
  .note{background:var(--navy-soft);border-radius:8px;padding:10px;font-size:12px;color:var(--ink2);line-height:1.45}
  .checks{margin:10px 2px;font-size:13px;line-height:1.8;color:var(--ink2)}
  .leg{font:700 10px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .two .row{gap:6px}.two .nm{font-size:15px}
  .b.danger{background:var(--loss);border-color:var(--loss);color:#fff}
  .b[disabled]{opacity:.4}
  .stp{font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--navy-soft);color:var(--ink2)}
  .stp.gold{background:var(--gold);color:var(--navy)}.stp.ok{background:var(--win);color:#fff}.stp.bad{background:var(--loss);color:#fff}
  .steps{display:flex;gap:6px;margin:10px 0 4px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .steps span{flex:1;text-align:center;padding:6px 0;border-bottom:3px solid var(--border)}
  .steps .on{color:var(--navy);border-color:var(--gold)}.steps .done{border-color:var(--navy)}
  .sbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .colh{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--navy);color:#fff;border-radius:8px;padding:7px 8px;position:sticky;top:0;z-index:2}
  .colh.me{background:var(--gold);color:var(--navy)}
  .crs{display:flex;align-items:center;gap:6px;margin:6px 0;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:8px;padding:5px 6px;font:700 13px var(--display)}
  .crs button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font:700 15px var(--body)}
  .crs small{margin-left:auto;font:500 10px var(--body);color:var(--muted)}
  .pc2{display:flex;gap:6px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px;margin-top:5px}
  .pc2.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:var(--gold-soft)}
  .pc2 .pos{min-width:28px;font-size:10px}
  .pn2{font:700 13px/1.15 var(--display);min-width:0}.pn2 small{display:block;font:500 10px var(--body);color:var(--muted)}
  .sticky{position:sticky;bottom:0;background:var(--page-bg);padding:10px 0 4px;border-top:1px solid var(--border);margin-top:10px}
  .cwrap{position:fixed;inset:0;z-index:85;background:rgba(15,29,52,.5);display:none;align-items:flex-end;justify-content:center}
  .cwrap.on{display:flex}
  .cbox{width:100%;max-width:480px;max-height:85dvh;overflow:auto;background:var(--page-bg);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
  .cbox h3{font:700 24px var(--display);margin-bottom:6px}
  .sb2{font-style:normal;background:var(--loss);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
  .tbadge{position:relative}
  .tbadge[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--loss);color:#fff;font:700 10px var(--body);min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;filter:none}
  body.busy{cursor:progress}body.busy .b{pointer-events:none;opacity:.6}
  .card.offer .two{margin-top:4px}
  .psheet.full{height:92dvh;max-height:92dvh}
  .tgrid2{display:flex;gap:8px;overflow:auto;height:calc(92dvh - 150px);padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .gcol{flex:0 0 140px;display:flex;flex-direction:column;gap:4px}
  .gcol.mine{position:sticky;left:0;z-index:3;background:var(--page-bg);padding-right:6px;box-shadow:6px 0 8px -6px var(--navy-shadow)}
  .ghead{position:sticky;top:0;z-index:2;display:block;width:100%;text-align:left;background:var(--navy);color:#fff;border-radius:10px;padding:8px}
  .ghead.me{background:var(--gold);color:var(--navy)}
  .ghead b{display:block;font:700 14px/1.05 var(--display)}.ghead small{font-size:10px;opacity:.8}
  .gtrade{display:inline-block;margin-top:5px;background:var(--gold);color:var(--navy);border-radius:5px;padding:2px 7px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em}
  .gpos{font:700 10px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:6px}
  .gp{background:var(--surface);border:1px solid var(--border);border-left:4px solid #6b778d;border-radius:7px;padding:4px 6px}
  .gp.p-QB{border-left-color:#7a3e9d}.gp.p-RB{border-left-color:var(--win)}.gp.p-WR{border-left-color:#3b6fb6}.gp.p-TE{border-left-color:#c46a1b}
  .gp.blk{background:var(--gold-soft);border-color:var(--gold)}
  .gp.blk b::after{content:" 🏷️"}
  .gp b{display:block;font:700 13px/1.1 var(--display)}.gp small{font-size:10px;color:var(--muted)}
  .gradebox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:8px 0}
  .gl{display:flex;gap:8px}
  .grade{flex:1;text-align:center;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:5px 0;background:var(--navy-soft)}
  .grade.gAp,.grade.gA{background:var(--win);color:#fff}.grade.gB{background:#3b6fb6;color:#fff}.grade.gC{background:var(--gold);color:var(--navy)}.grade.gD,.grade.gF{background:var(--loss);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip2{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 11px;font:600 13px var(--body)}
  .chip2.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .gotw{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:10px}
  .gotw.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:var(--gold-soft)}
  .gtag{display:flex;justify-content:space-between;font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dark)}
  .gmine{color:var(--win)}
  .gln{display:flex;justify-content:space-between;font:700 17px/1.3 var(--display);margin-top:4px}

  // ROSTERS + TRADES (lab). Rosters are STAGED: the 2026 auction draft (data/MAFFL_Draft_History_Clean_v3.csv)
  // plus any trades approved in the test Sheet. Weekly points: data/MAFFL_Top_Performers_2026.csv (top 3 per team).
  // Nothing here touches ESPN or gold data.
  // =====================================================================
  var DRAFT = [], TOPS = [], TEAM_SUB = "roster", BLD = null;
  var POS_ORDER = ["QB", "RB", "WR", "TE", "K", "D/ST", "DST", "DEF"];
  function parseCSV(t) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    var head = rows.shift().map(function (h) { return h.replace(/^﻿/, "").trim(); });
    return rows.filter(function (r) { return r.length > 1; }).map(function (r) { var o = {}; head.forEach(function (h, k) { o[h] = r[k]; }); return o; });
  }
  function loadRosters() {
    return Promise.all([
      getText("../data/MAFFL_Draft_History_Clean_v3.csv").then(function (t) { DRAFT = parseCSV(t); }),
      getText("../data/MAFFL_Top_Performers_2026.csv").then(function (t) { TOPS = parseCSV(t); }).catch(function () {})
    ]).catch(function () {});
  }
  function pkey(tier, name) { return tier + ":" + name; }
  // Current rosters = draft picks, then approved test trades applied in order.
  function rosters() {
    var y = (window.SCHEDULE_DATA && SCHEDULE_DATA.year) || 2026, R = {};
    DRAFT.filter(function (d) { return +d.Year === y; }).forEach(function (d) {
      var t = teamOf(d.Owner); if (!BY_OWNER[norm(d.Owner)]) return;
      (R[norm(d.Owner)] = R[norm(d.Owner)] || []).push({ name: d.Player || d.Player_Raw, pos: d.Position_Actual || d.Draft_Slot, nfl: d.NFL_Team, price: +d.Price || 0, owner: t.owner, tier: t.tier });
    });
    (SUM.offers || []).filter(function (o) { return o.status === "APPROVED"; }).sort(function (a, b) { return new Date(a.updated) - new Date(b.updated); }).forEach(function (o) {
      var F = R[norm(o.from)] = R[norm(o.from)] || [], T = R[norm(o.to)] = R[norm(o.to)] || [];

    return h + '<div class="card"><div class="eb">Trade with ' + esc(them.team) + (BLD.counterOf ? ' · counteroffer' : '') + '</div><div class="two"><div>' + legHTML("You send", ME.owner, gN, BLD.gc) + '</div><div>' + legHTML("You get", BLD.with, tN, BLD.tc) + '</div></div></div>' +
      gradeHTML(gradeTrade(ME.owner, BLD.with, gN, tN, BLD.gc, BLD.tc), "You", them.team.split(" ")[0]) +
      '<div class="checks">' + checks.map(function (c) { return (c[0] ? "✅ " : "❌ ") + esc(c[1]); }).join("<br>") + '</div>' +
      '<div class="grp">Why this deal? (tap any)</div><div class="chips">' + REASONS.map(function (r) { return '<button class="chip2' + (BLD.reasons[r] ? ' on' : '') + '" data-reason="' + esc(r) + '">' + esc(r) + '</button>'; }).join("") + '</div>' +
      '<input class="field" id="bnote2" maxlength="200" placeholder="Add your own note (optional)" value="' + esc(BLD.note) + '">' +
      '<div class="btns"><button class="b" data-bstep="2">Edit</button><button class="b pri" data-bsend="1"' + (ok ? '' : ' disabled') + '>Send offer</button></div>';
  }

  // ---------- confirm (guardrail) ----------
  function confirmBox(title, html, okLabel, danger, withReason) {
    return new Promise(function (resolve) {
      $("cbox").innerHTML = '<h3>' + esc(title) + '</h3>' + html + (withReason ? '<input class="field" id="creason" maxlength="200" placeholder="Reason (shown to both teams)">' : '') +
        '<div class="btns"><button class="b" id="cno">Not yet</button><button class="b ' + (danger ? 'danger' : 'pri') + '" id="cyes">' + esc(okLabel) + '</button></div>';
      $("cwrap").classList.add("on");
      $("cno").onclick = function () { $("cwrap").classList.remove("on"); resolve(null); };
      $("cyes").onclick = function () { var r = withReason ? $("creason").value : true; $("cwrap").classList.remove("on"); resolve(r || true); };
    });
  }
  function busy(on) { document.body.classList.toggle("busy", !!on); }
  function afterChange(msg) {
    return api("summary", creds()).then(function (r) { if (r.ok) SUM = r; refreshTeam(); paint(); if (msg) toast(msg); });
  }
  function refreshTeam() { renderTeam(); var c = badgeCount(); document.querySelector(".tbadge").setAttribute("data-n", c || ""); }

  document.addEventListener("click", function (e) {
    var el;
    if ((el = e.target.closest("[data-player]"))) { openSheet("player", el.dataset.player, null, $("psheet").classList.contains("on")); return; }
    if ((el = e.target.closest("[data-blk]"))) {
      var on = el.dataset.blk === "on", note = ($("bnote") || {}).value || "";
      busy(1); api("block", Object.assign(creds(), { player: pkey(ME.tier, el.dataset.pk), on: on, note: note })).then(function (r) {
        busy(0); if (!r.ok) { toast(r.error); return; } afterChange(on ? "On the block 🏷️" : "Off the block").then(function () { closeSheet(); });
      }).catch(function () { busy(0); toast("Couldn't reach the league server"); });
      return;
    }
    if ((el = e.target.closest("[data-newtrade]"))) { startBuilder(); return; }
    if ((el = e.target.closest("[data-trade-with]"))) { startBuilder(el.dataset.tradeWith, el.dataset.tradeWant); return; }
    if ((el = e.target.closest("[data-counter]"))) { var co = (SUM.offers || []).filter(function (o) { return o.id === el.dataset.counter; })[0]; if (co) startBuilder(null, null, co); return; }
    if ((el = e.target.closest("[data-bteam]"))) { BLD.with = el.dataset.bteam; BLD.step = 2; openSheet("builder", null, null, false); return; }
    if ((el = e.target.closest("[data-pick]"))) { var side = BLD[el.dataset.pick]; if (side[el.dataset.name]) delete side[el.dataset.name]; else side[el.dataset.name] = 1; el.classList.toggle("on");
      var keep = $("sb").scrollTop; openSheet("builder", null, null, false); $("sb").scrollTop = keep; return; }
    if ((el = e.target.closest("[data-cr2]"))) { var g = el.dataset.cr2 === "give", max = availCredits(g ? ME.owner : BLD.with), k2 = g ? "gc" : "tc";
      BLD[k2] = Math.max(0, Math.min(max, BLD[k2] + (+el.dataset.d))); var keep2 = $("sb").scrollTop; openSheet("builder", null, null, false); $("sb").scrollTop = keep2; return; }
    if ((el = e.target.closest("[data-reason]"))) { if ($("bnote2")) BLD.note = $("bnote2").value; var rz = el.dataset.reason; if (BLD.reasons[rz]) delete BLD.reasons[rz]; else BLD.reasons[rz] = 1; el.classList.toggle("on"); return; }
    if ((el = e.target.closest("[data-bstep]"))) { if ($("bnote2")) BLD.note = $("bnote2").value; BLD.step = +el.dataset.bstep; openSheet("builder", null, null, false); return; }
    if ((el = e.target.closest("[data-bsend]"))) {
      BLD.note = $("bnote2").value;
      var them2 = teamOf(BLD.with);
      confirmBox("Send this offer?", '<p class="p">To <b>' + esc(them2.team) + '</b>. They can accept, decline or counter. You can withdraw it until they answer.</p><div class="card two" style="margin-top:8px"><div>' + legHTML("You send", ME.owner, Object.keys(BLD.give), BLD.gc) + '</div><div>' + legHTML("You get", BLD.with, Object.keys(BLD.get), BLD.tc) + '</div></div>', "Yes, send it").then(function (yes) {
        if (!yes) return; busy(1);
        var send = api("offer", Object.assign(creds(), { to: BLD.with, give: Object.keys(BLD.give), get: Object.keys(BLD.get), giveCredits: BLD.gc, getCredits: BLD.tc, note: BLD.note, reasons: Object.keys(BLD.reasons) }));
        var prev = BLD.counterOf ? api("respond", Object.assign(creds(), { offer_id: BLD.counterOf, decision: "decline" })) : Promise.resolve({ ok: true });
        Promise.all([send, prev]).then(function (rs) { busy(0); if (!rs[0].ok) { toast(rs[0].error); return; } closeSheet(); TEAM_SUB = "trades"; afterChange("Offer sent to " + them2.team + " ✓"); })
          .catch(function () { busy(0); toast("Couldn't reach the league server"); });
      });
      return;
    }
    if ((el = e.target.closest("[data-act]"))) {
      var o = (SUM.offers || []).filter(function (x) { return x.id === el.dataset.id; })[0]; if (!o) return;
      var act = el.dataset.act, T = {
        accept: ["Accept this trade?", "The 24-hour review starts and the deal shows up for your tier. Players move on ESPN; credits move only after the commish approves.", "Yes, accept", false],
        decline: ["Decline this offer?", teamOf(o.from).team + " will see that you declined.", "Decline", true],
        withdraw: ["Withdraw your offer?", "It disappears for " + teamOf(o.to).team + ".", "Withdraw", true],
        approve: ["Approve this trade?", "Final. In the real app this queues the credit rows for the Credit Log.", "Approve", false],
        negate: ["Negate this trade?", "Both legs come back. Give a reason; both teams see it.", "Negate", true] }[act];
      var me2 = isMe(o.from) || isMe(o.to);
      confirmBox(T[0], '<p class="p">' + esc(T[1]) + '</p>' + offerCard(o).replace(/<div class="btns">[\s\S]*?<\/div><\/div>$/, '</div>'), T[2], T[3], act === "negate").then(function (yes) {
        if (!yes) return; busy(1);
        var call = act === "approve" || act === "negate" ? api("commish", Object.assign(creds(), { offer_id: o.id, decision: act, reason: typeof yes === "string" ? yes : "" }))
          : api("respond", Object.assign(creds(), { offer_id: o.id, decision: act }));
        call.then(function (r) { busy(0); if (!r.ok) { toast(r.error); return; } afterChange({ accept: "Accepted · 24h review started", decline: "Declined", withdraw: "Withdrawn", approve: "Approved ✓", negate: "Negated" }[act]); })
          .catch(function () { busy(0); toast("Couldn't reach the league server"); });
      });
      return;
    }
  });

  // ---------- sheets: owner + rivalry (replace page jumps) ----------
  function ownerOfTeam(team) { var t = TEAMS.filter(function (x) { return norm(x.team) === norm(team); })[0]; return t && t.owner; }
  var stackS = [];
  function openSheet(kind, a, b, push) {
    if (kind === "rivalry" && isMe(b)) { var tmp = a; a = b; b = tmp; } // you're always on the left
    if (!push) stackS = []; stackS.push([kind, a, b]);
    $("sb").innerHTML = kind === "player" ? playerSheet(a) : kind === "builder" ? builderSheet() : kind === "owner" ? ownerSheet(a) : kind === "rules" ? rulesSheet(a) : kind === "rule" ? ruleSheet(a) : kind === "prizes" ? prizesSheet() : '<div class="rivsheet">' + rivalryFrame(a, b, "sheet") + '</div>'; $("sb").scrollTop = 0;
    paint($("sb"));
    if (kind === "rules") { var q = $("rq"); q.oninput = function () { $("rlist").innerHTML = ruleList(q.value); }; }
    $("sback").style.visibility = stackS.length > 1 ? "visible" : "hidden";
    $("psheet").classList.toggle("full", kind === "builder" || kind === "rivalry");
    $("psheet").classList.add("on"); $("sscrim").classList.add("on"); document.body.style.overflow = "hidden";
  }
  function closeSheet() { $("psheet").classList.remove("on"); $("sscrim").classList.remove("on"); document.body.style.overflow = ""; stackS = []; }
  $("sx").onclick = closeSheet; $("sscrim").onclick = closeSheet;
  $("sback").onclick = function () { stackS.pop(); var t = stackS.pop(); if (t) openSheet(t[0], t[1], t[2], true); };
  function gameRow(owner, g, other) { // g from h2h(owner, other); ref is the same from either side
    return '<div class="row" data-ref="h2h:' + g.y + ':' + g.wk + ':' + esc([norm(owner), norm(other)].sort().join("~")) + '"><span class="wl ' + (g.aWon ? "W" : "L") + '">' + (g.aWon ? "W" : "L") + '</span><div><div class="nm">' + f2(g.as) + ' – ' + f2(g.bs) + '</div><div class="meta">' + g.y + ' Wk ' + g.wk + (g.type !== "R" ? ' · ' + ({ Q: "Quarterfinal", S: "Semifinal", C: "Championship", T: "3rd place" }[g.type] || "Playoffs") : '') + '</div></div></div>';
  }
  function rivalrySheet(a, b) {
    var A = teamOf(a), B = teamOf(b), r = h2h(a, b);
    var po = r.all.filter(function (g) { return g.type !== "R"; }), poW = po.filter(function (g) { return g.aWon; }).length;
    var avgA = r.n ? r.all.reduce(function (s, g) { return s + g.as; }, 0) / r.n : 0, avgB = r.n ? r.all.reduce(function (s, g) { return s + g.bs; }, 0) / r.n : 0;
    var h = '<div class="mhero" style="margin-top:12px"><div class="eb" style="color:var(--gold)">⚔️ Rivalry · since ' + (r.n ? r.all[0].y : "—") + '</div><div class="vs">' +
      '<div><div class="av">' + initials(a) + '</div><div class="tn">' + esc(A.team) + '</div><div class="rec">' + esc(a) + '</div></div><div class="mid">VS</div>' +
      '<div><div class="av opp">' + initials(b) + '</div><div class="tn">' + esc(B.team) + '</div><div class="rec">' + esc(b) + '</div></div></div>' +
      (r.n ? '<div class="strip"><div><b>' + r.aw + '–' + r.bw + '</b><small>Series</small></div><div><b>' + r.streak + '</b><small>Streak</small></div><div><b>' + poW + '–' + (po.length - poW) + '</b><small>Playoffs</small></div></div>' +
        '<div class="strip"><div><b>' + f2(avgA) + '</b><small>Avg score</small></div><div><b>' + f2(avgB) + '</b><small>Avg score</small></div></div>' : '<p style="margin-top:12px">First-ever meeting.</p>') + '</div>';
    if (r.n) {
      h += '<div class="card"><div class="eb">Biggest wins</div>' +
        (r.bigA ? '<div class="item"><span class="ic">💥</span><div class="tx"><b>' + esc(A.team) + '</b>by ' + f2(r.bigA.m) + ' · ' + r.bigA.g.y + ' Wk ' + r.bigA.g.wk + '</div></div>' : '') +
        (r.bigB ? '<div class="item"><span class="ic">💥</span><div class="tx"><b>' + esc(B.team) + '</b>by ' + f2(r.bigB.m) + ' · ' + r.bigB.g.y + ' Wk ' + r.bigB.g.wk + '</div></div>' : '') + '</div>';
      h += '<div class="card glist"><div class="eb">Every meeting · ' + esc(A.team) + '\'s view</div>' + r.all.slice().reverse().map(function (g) { return gameRow(a, g, b); }).join("") + '</div>';
    }
    h += '<div class="btns"><button class="b" data-owner-push="' + esc(a) + '">' + esc(A.team) + '</button><button class="b" data-owner-push="' + esc(b) + '">' + esc(B.team) + '</button></div>';
    return h;
  }
  function ownerSheet(o) {
    var t = teamOf(o), c = career(o), active = !!BY_OWNER[norm(o)];
    var season = (window.MATCHUPS_DATA || []).filter(function (r) { return r[0] === (SCHEDULE_DATA.year || 2026) && (norm(r[3]) === norm(o) || norm(r[5]) === norm(o)); })
      .sort(function (x, y) { return y[1] - x[1]; });
    var h = '<div class="thero" style="margin:0 -14px;border-radius:0"><div class="tn">' + esc(active ? t.team : o) + '</div><div class="sub">' + esc(o) + (active ? ' · ' + (t.tier === "U" ? "Upper" : "Lower") + (t.div ? ' · Div ' + t.div : '') : ' · former owner') + '</div>' +
      (active ? '<div class="kpis"><div class="kpi"><b>' + rec(t) + '</b><small>Record</small></div><div class="kpi"><b>#' + t.rank + '</b><small>' + (t.tier === "U" ? "Upper" : "Lower") + '</small></div><div class="kpi"><b>' + t.credits + '</b><small>Credits</small></div><div class="kpi"><b>' + Math.round(t.points) + '</b><small>Pts for</small></div></div>' : '') + '</div>';
    h += '<div class="card"><div class="eb">Career since 2005</div><div class="stat3"><div><b>' + c.w + '–' + c.l + '</b><small>Reg. season</small></div><div><b>' + c.titles + '</b><small>Titles</small></div><div><b>' + c.playoffs + '</b><small>Playoff years</small></div></div>' +
      (c.best ? '<p style="margin-top:10px">Best score: ' + f2(c.best.s) + ' (' + c.best.y + ' Wk ' + c.best.wk + ').</p>' : '') +
      (PRIZE ? '<p>Prize money since ' + PRIZE.meta.data_start + ': <b class="money">$' + PRIZE.prize_events.filter(function (e) { return norm(e.owner) === norm(o); }).reduce(function (s2, e) { return s2 + e.amount; }, 0).toLocaleString() + '</b></p>' : '') + '</div>';
    if (!isMe(o)) {
      var r = h2h(ME.owner, o);
      h += '<div class="card navy"><div class="eb">You vs. them</div><h3>' + (r.n ? r.aw + '–' + r.bw + (r.aw > r.bw ? ' · you lead' : r.aw < r.bw ? ' · they lead' : ' · even') : 'Never played') + '</h3>' +
        (r.n ? '<div class="dots">' + r.last.map(function (x) { return '<i class="' + (x.aWon ? "W" : "L") + '">' + (x.aWon ? "W" : "L") + '</i>'; }).join("") + '</div>' : '') +
        (r.n ? '<div class="btns"><button class="b pri" data-riv-push="' + esc(ME.owner) + '|' + esc(o) + '">Open rivalry</button></div>' : '<p>Your first meeting is still ahead.</p>') + '</div>';
    }
    if (season.length) h += '<div class="card glist"><div class="eb">' + (SCHEDULE_DATA.year || 2026) + ' games</div>' + season.map(function (r) {
      var won = norm(r[3]) === norm(o), opp = won ? r[5] : r[3];
      return '<div class="row"><span class="wl ' + (won ? "W" : "L") + '">' + (won ? "W" : "L") + '</span><div><div class="nm">' + f2(won ? r[4] : r[6]) + ' – ' + f2(won ? r[6] : r[4]) + '</div><div class="meta">Wk ' + r[1] + ' vs <button class="tl2" data-riv-push="' + esc(o) + '|' + esc(opp) + '">' + esc(teamOf(opp).team) + '</button></div></div></div>'; }).join("") + '</div>';
    return h;
  }
  // Rulebook, read in the app straight from rules.html (always current)
  var RULES = null;
  function rules() {
    if (RULES || !RULES_HTML) return RULES || [];
    var doc = new DOMParser().parseFromString(RULES_HTML, "text/html");
    RULES = Array.prototype.map.call(doc.querySelectorAll(".rule-section"), function (sec, k) {
      var t = sec.querySelector(".rule-title"), b = sec.querySelector(".rule-body");
      return { k: k, title: t ? t.textContent.trim() : "Section", html: b ? b.innerHTML : "", text: b ? b.textContent.replace(/\s+/g, " ") : "" };
    }).filter(function (r) { return r.text.trim().length > 20; });
    return RULES;
  }
  function ruleList(q) {
    q = (q || "").trim().toLowerCase();
    return rules().filter(function (r) { return !q || r.title.toLowerCase().indexOf(q) >= 0 || r.text.toLowerCase().indexOf(q) >= 0; }).map(function (r) {
      var snip = "";
      if (q) { var i = r.text.toLowerCase().indexOf(q); if (i >= 0) snip = '<div class="meta">…' + esc(r.text.slice(Math.max(0, i - 40), i + 70)) + '…</div>'; }
      return '<button class="row" style="width:100%;text-align:left" data-rule="' + r.k + '"><div style="flex:1"><div class="nm">' + esc(r.title) + '</div>' + snip + '</div><span class="rv">›</span></button>'; }).join("") || '<p class="p">Nothing matches.</p>';
  }
  function rulesSheet() {
    return '<div class="sh" style="padding-left:0"><h2>📋 Rulebook</h2></div><input class="field" id="rq" placeholder="Search the rules (e.g. trade, credits, tiebreak)" autocomplete="off">' +
      '<div class="card" style="padding:4px 12px" id="rlist">' + ruleList("") + '</div>';
  }
  function ruleSheet(k) {
    var r = rules().filter(function (x) { return String(x.k) === String(k); })[0];
    if (!r) return '<p class="p">Section not found.</p>';
    return '<div class="sh" style="padding-left:0"><h2>📋 Rulebook</h2></div><div class="card"><h3>' + esc(r.title) + '</h3><div class="rbody">' + r.html + '</div></div>';
  }
  function prizesSheet() {
    if (!PRIZE) return '<p class="p">Prize data unavailable.</p>';
    var tot = {}; PRIZE.prize_events.forEach(function (e) { tot[e.owner] = (tot[e.owner] || 0) + e.amount; });
    var top = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; });
    var lastY = Math.max.apply(null, PRIZE.prize_events.map(function (e) { return e.year; }));
    var last = PRIZE.prize_events.filter(function (e) { return e.year === lastY; }).sort(function (a, b) { return b.amount - a.amount; });
    return '<div class="sh" style="padding-left:0"><h2>💰 Prizes &amp; payouts</h2></div>' +
      '<div class="card navy"><div class="eb">Paid out since ' + PRIZE.meta.data_start + '</div><h3 class="money" style="font-size:34px">$' + (PRIZE.meta.grand_total || 0).toLocaleString() + '</h3></div>' +
      '<div class="card glist"><div class="eb">' + lastY + ' payouts</div>' + last.map(function (e) {
        return '<div class="row"><div><div class="nm"><button class="tl2" data-owner-push="' + esc(e.owner) + '">' + esc(e.owner) + '</button></div><div class="meta">' + esc(e.prize_type) + (e.place ? ' · #' + e.place : '') + (e.era ? ' · ' + esc(e.era) : '') + '</div></div><div class="rt money">$' + e.amount + '</div></div>'; }).join("") + '</div>' +
      '<div class="card glist"><div class="eb">All-time earnings</div>' + top.map(function (o, k) {
        return '<div class="row"><div class="rt" style="margin:0;min-width:26px;text-align:left">' + (k + 1) + '</div><div style="flex:1"><button class="tl2 nm" data-owner-push="' + esc(o) + '">' + esc(o) + '</button></div><div class="rt money">$' + tot[o].toLocaleString() + '</div></div>'; }).join("") + '</div>' +
      '<div class="btns"><button class="b" data-rule-title="Prize Schedule">Prize rules</button></div>';
  }

  // One click handler for every owner/rivalry tap in the app
  document.addEventListener("click", function (e) {
    var el;
    if (!e.target.isConnected || e.target.closest("#welcome")) return; // a tap that re-rendered the welcome screen
    if ((el = e.target.closest("[data-rules]"))) { openSheet("rules"); return; }
    if ((el = e.target.closest("[data-prizes]"))) { openSheet("prizes"); return; }
    if ((el = e.target.closest("[data-rule]"))) { openSheet("rule", el.dataset.rule, null, true); return; }
    if ((el = e.target.closest("[data-rule-title]"))) { var rr = rules().filter(function (x) { return x.title === el.dataset.ruleTitle; })[0]; if (rr) openSheet("rule", rr.k, null, true); return; }
    if ((el = e.target.closest("[data-owner-push]"))) { e.preventDefault(); openSheet("owner", el.dataset.ownerPush, null, true); return; }
    if ((el = e.target.closest("[data-riv-push]"))) { e.preventDefault(); var p = el.dataset.rivPush.split("|"); openSheet("rivalry", p[0], p[1], true); return; }
    if ((el = e.target.closest("a[href*='rivalry.html#vs=']"))) {
      e.preventDefault(); var m = /#vs=([^,]+),(.+)$/.exec(el.getAttribute("href"));
      if (m) openSheet("rivalry", decodeURIComponent(m[1]), decodeURIComponent(m[2]), $("psheet").classList.contains("on")); return; }
    if ((el = e.target.closest("[data-owner]")) && !e.target.closest(".welcome")) {
      if ($("hstack") && $("hstack").contains(el) && el.closest(".dcard.drag")) return;
      e.preventDefault(); openSheet("owner", el.dataset.owner, null, $("psheet").classList.contains("on")); }
  });

  function setWeek(n) {
    W = WEEKS.filter(function (w) { return w.weekNumber === n; })[0] || LATEST;
    buildTeams(); ME = BY_OWNER[norm(ME.owner)] || ME; closeSheet(); start(); tab("home");
  }

  // ---------- boot ----------
  function start() {
    var saved = store("maffl_lab_owner");
    ME = saved && BY_OWNER[norm(saved)];
    if (API_URL && !store("maffl_lab_pin")) { showWelcome("pin"); return; }
    if (!ME) { showWelcome(); return; }
    $("hdrwk").innerHTML = '<b>Week ' + W.weekNumber + '</b>' + (ME.tier === "U" ? "Upper" : "Lower") + ' Tier';
    var pb = $("pastbar"); pb.style.display = W === LATEST ? "none" : "flex";
    pb.innerHTML = '📅 Replaying Week ' + W.weekNumber + ' (' + esc(W.dateString) + ')<button id="pbback">Back to now</button>';
    if (W !== LATEST) $("pbback").onclick = function () { setWeek(LATEST.weekNumber); };
    $("chip").textContent = initials(ME.owner);
    $("chip").onclick = function () { if (API_URL) tab("team"); else showWelcome(); };
    renderHome(); renderMatch(); renderTeam(); renderLeague(); renderMore();
    loadSummary();
    var h = location.hash.slice(1);
    tab(TITLES[h] ? h : "home");
  }
  loadPulse().then(function () { buildTeams(); $("boot").style.display = "none"; start(); })
    .catch(function (e) { $("boot").textContent = "Couldn't load the league data (" + e.message + ")."; });
})();
