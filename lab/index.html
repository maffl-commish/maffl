<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MAFFL HQ · Lab</title>
<link rel="icon" href="../maffl-logo.png">
<link rel="apple-touch-icon" href="../maffl-logo.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  MAFFL HQ app — PROTOTYPE v0 (lab). Read-only, real data, not linked from the site.
  Design: _ops/docs/APP_DESIGN.md. Reads: ../weekly.html (latest WEEKS object, at runtime),
  ../schedule-data.js, ../matchups-data.js, ../key-dates-data.js. Writes nothing.
  Identity is "pick your team" (stored on this phone) until passphrases are connected.
-->
<style>
  :root{--surface:#fff;--page-bg:#f8f9fb;--navy:#1a2e50;--navy-soft:rgba(26,46,80,.07);--navy-shadow:rgba(26,46,80,.10);
    --gold:#f5a623;--gold-dark:#d98e10;--gold-soft:#fffaf0;--muted:#8a9ab5;--ink2:#4a5a78;--border:#e2e6ed;--win:#1d9e75;--loss:#c04a4a;
    --display:"Barlow Condensed",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  /* iPhone: no double-tap zoom, no font inflation; only #views (and the sideways rows) ever scroll */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:var(--page-bg);color:var(--navy);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  body{position:fixed;inset:0}
  .app{max-width:480px;margin:0 auto;height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden}
  .keys,.wkchips,.rings,.tgrid2,.dbody,.sb,.cbox,.welcome{overscroll-behavior:contain}
  input,select,textarea{font-size:16px}
  #views{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .view{display:none}.view.on{display:block}
  .hdr{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);z-index:20;padding-top:env(safe-area-inset-top)}
  .hdr-in{display:flex;align-items:center;gap:8px;padding:8px 14px}
  .hdr img{height:36px;width:36px}
  .hdr .t{font:700 22px var(--display)}
  .hdr .wk{margin-left:auto;font:600 12px var(--body);color:var(--muted);text-align:right;line-height:1.2}
  .hdr .wk b{display:block;color:var(--navy);font:700 14px var(--display);text-transform:uppercase;letter-spacing:.04em}
  .chip{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 13px var(--display)}
  .lab{background:var(--gold);color:var(--navy);font:700 10px var(--display);letter-spacing:.12em;text-align:center;padding:2px 0;text-transform:uppercase}
  .sh{padding:16px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .sh h2{font:700 13px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  .sh a,.sh small{font:600 12px var(--body);color:var(--gold-dark)}
  .pad{padding:0 14px}
  .rings{display:flex;gap:14px;overflow-x:auto;padding:4px 14px 4px;scrollbar-width:none}
  .rings::-webkit-scrollbar{display:none}
  .ring{flex:0 0 auto;width:62px;text-align:center;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.05em}
  .ring i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 5px;border-radius:50%;font-style:normal;font-size:25px;background:var(--surface);box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--page-bg)}
  .ring.seen{color:var(--muted)}.ring.seen i{box-shadow:0 0 0 2px var(--border),0 0 0 4px var(--page-bg)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;box-shadow:0 1px 3px var(--navy-shadow)}
  .card.navy{background:linear-gradient(135deg,#243a62,#1a2e50 55%,#0f1d34);color:#fff;border:0;border-left:4px solid var(--gold)}
  .card.soon{border-style:dashed;box-shadow:none;background:transparent}
  .card.soon .eb{color:var(--muted)}
  .eb{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--gold-dark)}
  .navy .eb{color:var(--gold)}
  .card h3{font:700 21px/1.1 var(--display);margin:4px 0 6px}
  .card p,.p{font-size:14px;line-height:1.45;color:var(--ink2)}
  .navy p{color:#c8d2e4}
  .btns{display:flex;gap:8px;margin-top:12px}
  .b{flex:1;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.05em;border-radius:8px;padding:11px 6px;border:1px solid var(--border);background:var(--surface);color:var(--navy);text-align:center;display:block}
  .b.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navy .b{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
  .navy .b.pri{background:var(--gold);color:var(--navy);border-color:var(--gold)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:0}
  .nm{font:700 17px/1.15 var(--display)}
  .meta{font-size:12px;color:var(--muted);line-height:1.35}
  .rt{margin-left:auto;text-align:right;font:700 17px var(--display);white-space:nowrap}
  .rt small{display:block;font:500 11px var(--body);color:var(--muted)}
  .w{color:var(--win)}.l{color:var(--loss)}
  .rv{display:inline-block;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--gold-dark)}
  .mini{border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:12px;margin-left:6px;flex:0 0 auto}
  .mini.sel,.reacts button.sel{background:var(--gold);border-color:var(--gold)}
  .reacts{display:flex;gap:6px}
  .reacts button{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:18px}
  .grp{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:14px 0 2px}
  .pill{display:inline-block;font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--navy-soft);color:var(--ink2)}
  .pill.gold{background:var(--gold);color:var(--navy)}
  /* match */
  .mhero{background:linear-gradient(135deg,#243a62,#1a2e50 55%,#0f1d34);color:#fff;border-radius:14px;padding:16px;margin-top:12px}
  .vs{display:flex;align-items:flex-start;text-align:center;margin-top:12px}
  .vs>div{flex:1;min-width:0}
  .av{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 18px var(--display);background:var(--gold);color:var(--navy)}
  .av.opp{background:#fff}
  .vs .tn{font:700 17px/1.1 var(--display)}
  .vs .rec{font-size:12px;color:#c8d2e4;margin-top:2px}
  .vs .mid{flex:0 0 36px;font:700 14px var(--display);color:var(--gold);padding-top:18px}
  .stakes{margin-top:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px;font-size:13px;color:#c8d2e4;line-height:1.55}
  .dots{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .dots i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--display);font-style:normal;color:#fff}
  .dots .W{background:var(--win)}.dots .L{background:var(--loss)}
  .stat3{display:flex;margin-top:8px;text-align:center}
  .stat3>div{flex:1}.stat3 b{display:block;font:700 24px var(--display)}.stat3 small{font-size:11px;color:var(--muted)}
  .meter{height:8px;border-radius:4px;background:var(--navy-soft);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--gold)}
  .game{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:8px}
  .game.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .game .ln{display:flex;justify-content:space-between;gap:8px;font:600 14px/1.55 var(--body)}
  .game .ln b{font:700 16px var(--display)}
  .game .ln.won{font-weight:700}
  .gfoot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
  .flag{font:700 10px var(--display);letter-spacing:.08em;color:var(--gold-dark);text-transform:uppercase}
  /* team */
  .thero{background:var(--surface);border-bottom:1px solid var(--border);padding:14px}
  .thero .tn{font:700 26px/1 var(--display)}
  .thero .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .kpis{display:flex;gap:8px;margin-top:12px}
  .kpi{flex:1;background:var(--page-bg);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center}
  .kpi b{display:block;font:700 20px var(--display)}.kpi small{font-size:11px;color:var(--muted)}
  .thtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.thtop .b.sm{flex:0 0 auto;width:auto;padding:7px 12px;font-size:12px;min-height:0}
  .kfoot{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
  .tjump{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}.tjump button{font:700 12px var(--display);color:var(--navy);background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:6px 11px}
  .tjump b{background:var(--navy);color:#fff;border-radius:999px;padding:0 6px;margin-left:3px}
  .tstart{display:flex;align-items:center;gap:12px;margin:12px 0 4px}.tstart .b{flex:0 0 auto;width:auto;padding:10px 16px}.tstart small{font-size:12px;color:var(--muted)}
  .cbal{display:flex;align-items:center;gap:12px;margin:12px 2px 2px}.cbal>b{font:800 44px/1 var(--display);color:var(--navy)}
  .cbal span{display:block;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--navy)}.cbal small{font-size:12px;color:var(--muted)}
  .seg{display:flex;background:var(--navy-soft);border-radius:10px;padding:3px;margin:12px 14px 0}
  .seg button{flex:1;min-width:0;padding:8px 0;border-radius:8px;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px var(--navy-shadow)}
  .seg.seg2{margin:10px 14px 0;max-width:220px}.seg.seg2 button{padding:6px 0;font-size:12px}
  .sub-v{display:none}.sub-v.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:6px 4px}
  td{padding:9px 4px;border-top:1px solid var(--border)}
  td.n,th.n{text-align:right;white-space:nowrap}
  tr.me td{background:rgba(245,166,35,.13);font-weight:700}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;display:block}
  .tile span{font-size:24px}.tile b{display:block;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .tile small{font-size:11px;color:var(--muted)}
  .list a,.list button{display:flex;width:100%;align-items:center;gap:12px;padding:14px;background:var(--surface);border-bottom:1px solid var(--border);font:700 16px var(--display);text-transform:uppercase;letter-spacing:.04em;text-align:left}
  .list a::after,.list button::after{content:"›";margin-left:auto;color:var(--muted);font-size:22px}
  .list span{font-size:20px}
  nav.tabs{flex:0 0 auto;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  nav.tabs button span{font-size:21px;filter:grayscale(1);opacity:.55}
  nav.tabs button.on{color:var(--navy)}
  nav.tabs button.on span{filter:none;opacity:1}
  nav.tabs button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--gold)}
  .pastbar{display:none;align-items:center;gap:8px;background:var(--navy);color:#fff;font:600 12px var(--body);padding:6px 14px}
  .pastbar button{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:6px;padding:4px 8px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em}
  .wkchips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 4px;scrollbar-width:none}
  .wkchips::-webkit-scrollbar{display:none}
  .wkchips button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px;font:700 13px var(--display);letter-spacing:.04em}
  .wkchips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rbody{font-size:14px;line-height:1.5;color:var(--ink2)}
  .rbody ul,.rbody ol{padding-left:18px;margin:6px 0}.rbody li{margin:4px 0}
  .rbody h3,.rbody h4{font:700 16px var(--display);color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
  .rbody p{margin:6px 0}.rbody strong{color:var(--navy)}
  .rbody table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;display:block;overflow-x:auto}
  .rbody th,.rbody td{border-top:1px solid var(--border);padding:6px 4px;text-align:left;vertical-align:top}
  .rbody .rule-tag{font:700 9px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold-dark);border:1px solid var(--gold);border-radius:3px;padding:1px 4px;margin-left:4px;white-space:nowrap}
  .rbody mark{background:rgba(245,166,35,.35)}
  .money{font-variant-numeric:tabular-nums}
  .opt{position:relative;display:flex;align-items:center;gap:8px;width:100%;margin-top:7px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;overflow:hidden;font:600 14px var(--body)}
  .opt .ob{position:absolute;left:0;top:0;bottom:0;background:rgba(245,166,35,.18)}
  .opt .ol,.opt .op{position:relative}.opt .op{margin-left:auto;font:700 14px var(--display);color:var(--ink2)}
  .opt small{color:var(--muted);font-weight:500}
  .opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
  .pinpad{font:700 26px var(--display);letter-spacing:.06em;text-align:center;text-transform:uppercase}
  .pos{display:inline-grid;place-items:center;min-width:34px;font:700 12px var(--display);border-radius:4px;padding:2px 4px;color:#fff;background:#6b778d;flex:0 0 auto}
  .pos.p-QB{background:#7a3e9d}.pos.p-RB{background:var(--win)}.pos.p-WR{background:#3b6fb6}.pos.p-TE{background:#c46a1b}.pos.p-CR{background:var(--gold);color:var(--navy)}
  .pos.big{min-width:54px;height:54px;font-size:18px;border-radius:12px}
  .tb{font:700 9px var(--display);letter-spacing:.1em;background:var(--gold);color:var(--navy);padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:2px}
  .prow{width:100%}
  .note{background:var(--navy-soft);border-radius:8px;padding:10px;font-size:12px;color:var(--ink2);line-height:1.45}
  .checks{margin:10px 2px;font-size:13px;line-height:1.8;color:var(--ink2)}
  .leg{font:700 10px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .two .row{gap:6px}.two .nm{font-size:15px}
  .b.danger{background:var(--loss);border-color:var(--loss);color:#fff}
  .b[disabled]{opacity:.4}
  .stp{font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--navy-soft);color:var(--ink2)}
  .stp.gold{background:var(--gold);color:var(--navy)}.stp.ok{background:var(--win);color:#fff}.stp.bad{background:var(--loss);color:#fff}
  .steps{display:flex;gap:6px;margin:10px 0 4px;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .steps span{flex:1;text-align:center;padding:6px 0;border-bottom:3px solid var(--border)}
  .steps .on{color:var(--navy);border-color:var(--gold)}.steps .done{border-color:var(--navy)}
  .sbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .colh{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--navy);color:#fff;border-radius:8px;padding:7px 8px;position:sticky;top:0;z-index:2}
  .colh.me{background:var(--gold);color:var(--navy)}
  .crs{display:flex;align-items:center;gap:6px;margin:6px 0;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:8px;padding:5px 6px;font:700 13px var(--display)}
  .crs button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font:700 15px var(--body)}
  .crs small{margin-left:auto;font:500 10px var(--body);color:var(--muted)}
  .pc2{display:flex;gap:6px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px;margin-top:5px}
  .pc2.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:var(--gold-soft)}
  .pc2 .pos{min-width:28px;font-size:10px}
  .pn2{font:700 13px/1.15 var(--display);min-width:0}.pn2 small{display:block;font:500 10px var(--body);color:var(--muted)}
  .sticky{position:sticky;bottom:0;background:var(--page-bg);padding:10px 0 4px;border-top:1px solid var(--border);margin-top:10px}
  .cwrap{position:fixed;inset:0;z-index:85;background:rgba(15,29,52,.5);display:none;align-items:flex-end;justify-content:center}
  .cwrap.on{display:flex}
  .cbox{width:100%;max-width:480px;max-height:85dvh;overflow:auto;background:var(--page-bg);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
  .cbox h3{font:700 24px var(--display);margin-bottom:6px}
  .sb2{font-style:normal;background:var(--loss);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
  .tbadge,.cbadge,.hbadge{position:relative}
  .hdr .chip{margin-left:auto}
  .cbadge[data-n]:not([data-n=""])::after,.tbadge[data-n]:not([data-n=""])::after,.hbadge[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--loss);color:#fff;font:700 10px var(--body);min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;filter:none}
  .tg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.tg:last-child{border-bottom:0}
  .tg div{flex:1}.tg b{display:block;font:700 15px var(--body);color:var(--navy)}.tg small{color:var(--muted);font-size:13px}
  .tg input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--border);position:relative;flex:none;transition:background .15s}
  .tg input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
  .tg input:checked{background:var(--navy)}.tg input:checked::after{left:23px}
  .nudge{display:flex;gap:8px;margin-top:10px}.nudge a{flex:1;text-align:center;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.05em;padding:9px 4px;border-radius:8px;border:1px dashed var(--border);color:var(--navy)}
  .lbl{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:12px;display:block}
  body.busy{cursor:progress}body.busy .b{pointer-events:none;opacity:.6}
  .card.offer .two{margin-top:4px}
  .psheet.full{height:92dvh;max-height:92dvh}
  .tgrid2{display:flex;gap:8px;overflow:auto;height:calc(92dvh - 150px);padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .gcol{flex:0 0 140px;display:flex;flex-direction:column;gap:4px}
  .gcol.mine{position:sticky;left:0;z-index:3;background:var(--page-bg);padding-right:6px;box-shadow:6px 0 8px -6px var(--navy-shadow)}

<script>
(function () {
  "use strict";

  // ---------- More → Settings ----------

      '<div class="card"><div class="eb">Your contact info</div><p class="meta">Only signed-in owners see it (never the public site). Used for trade texts and emails.</p>' +

      '<label class="lbl" for="stPhone">Mobile</label><input class="field" id="stPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="' + esc(fmtPhone(SET.phone)) + '" placeholder="(412) 555-0123"></div>' +
      '<div class="card"><div class="eb">Email me when…</div><p class="meta">All off unless you turn them on. No texts or push, ever.</p>' +
      NOTIFY.map(function (n) { return '<label class="tg"><div><b>' + n[1] + '</b><small>' + n[2] + '</small></div><input type="checkbox" data-nt="' + n[0] + '"' + (SET.notify && SET.notify[n[0]] ? ' checked' : '') + '></label>'; }).join("") + '</div>' +
      '<div class="btns" style="margin-bottom:16px"><button class="b pri" id="stSave">Save settings</button></div>';
  }
  function openSettings() {
    SET = null; openSheet("settings");
    api("settings", creds()).then(function (r) { SET = r.ok ? r : { error: r.error || "Couldn't load settings" }; openSheet("settings"); wireSettings(); })
      .catch(function () { SET = { error: "Couldn't reach the league server" }; openSheet("settings"); });
  }
  function wireSettings() {

      var n = {}; document.querySelectorAll("[data-nt]").forEach(function (x) { n[x.dataset.nt] = x.checked; });

      }).catch(function () { busy(0); toast("Couldn't reach the league server"); });

  }

  function R(x) { return "w" + W.weekNumber + ":" + x; }
  function DR(x) { return ' data-ref="' + esc(R(x)) + '"'; }
  var W, WEEKS = [], LATEST, TEAMS = [], BY_OWNER = {}, ME = null, NEXT_WK, PRIZE = null, CREDIT_LOG = [], RULES_HTML = null;

  // ---------- load latest Pulse week from weekly.html ----------
  // Pull an embedded data literal (array or object) out of one of the site's own pages.
  function extract(src, marker) {
    var i = src.indexOf(marker); if (i < 0) return null;
    var k = i + marker.length, open = src[k], close = open === "[" ? "]" : "}", d = 0, j = k;
    for (; j < src.length; j++) { if (src[j] === open) d++; if (src[j] === close) { d--; if (!d) break; } }

  }
  function getText(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.text(); }); }
  // SIDE.x: "loading" until it lands, then "ok" or "fail" (views show a spinner or a can't-load note).

    var side = Promise.all([
      getText("../prize.html").then(function (t) { PRIZE = extract(t, "const MAFFL = "); SIDE.prize = "ok"; }).catch(function () { SIDE.prize = "fail"; }),
      getText("../credits.html").then(function (t) { CREDIT_LOG = extract(t, "const REGISTRY_DATA = ") || []; SIDE.credits = "ok"; }).catch(function () { SIDE.credits = "fail"; })
    ]);
    // Not needed for the first screen: start now, don't wait. Views that use them refresh when they land.
    getText("../rules.html").then(function (t) { RULES_HTML = t; SIDE.rules = "ok"; }).catch(function () { SIDE.rules = "fail"; }).then(function () { sideLanded("rules"); });

    var main = getText("../weekly.html").then(function (t) {

  }
  // A background file arrived: redraw whatever is showing it (Team tab, an open rulebook / builder / player sheet).

  }

  function buildTeams() {
    TEAMS = []; BY_OWNER = {};

    });

        .sort(function (a, b) { return b.w - a.w || b.points - a.points; })

  }
  function logBalance(owner) { var hit = false, n = 0; CREDIT_LOG.forEach(function (r) { if (norm(r.owner) === norm(owner) && r.approved !== false) { hit = true; n += r.amount || 0; } }); return hit ? n : null; }
  function logged(id) { return CREDIT_LOG.some(function (r) { return String(r.notes || "").indexOf("[app L-" + id) >= 0; }); } // robot tags each row with its ledger id
  function teamOf(owner) { return BY_OWNER[norm(owner)] || { team: owner, owner: owner, w: 0, l: 0, tier: "?" }; }
  function isMe(owner) { return ME && norm(owner) === norm(ME.owner); }
  function rec(t) { return t.w + "–" + t.l; }

  // ---------- history (matchups-data.js) ----------
  function future(r) { var y = (window.SCHEDULE_DATA && SCHEDULE_DATA.year) || 2026; return r[0] === y && r[1] > W.weekNumber; }
  function h2h(a, b) {
    var A = norm(a), B = norm(b), games = [];

    var aw = games.filter(function (g) { return g.aWon; }).length;

    var bigA = null, bigB = null;

  var PRE2005_TITLES = { "mike murello": 1, "josh lavrinc": 1, "jeff grace": 1, "jimmy crisan": 1 }; // history.html: 2002 (co), 2003, 2004 — before matchups-data starts
  function career(owner) {
    var O = norm(owner), w = 0, l = 0, titles = PRE2005_TITLES[O] || 0, best = null, po = {};

      if (r[7] === "C" && win) titles++;

    });

  // ---------- header + tabs ----------

  // ---------- 🌅 daily run (REEL in-season mode; backend daily.js, GET action=daily) ----------

    var base = LATEST, nw = weekFromDaily(T, wk, base); WEEKS.push(nw); WEEKS.sort(function (a, b) { return a.weekNumber - b.weekNumber; });
    var wasLatest = W === LATEST; LATEST = WEEKS[WEEKS.length - 1]; if (wasLatest) W = LATEST;
  }
  function weekFromDaily(T, wk, base) {

  // Credit races from the daily run, in the Pulse tracker's shape (so the 💳 card and Team → Credits read it as is).
