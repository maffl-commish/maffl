<script>
  /* Keep same-origin navigation inside the iOS Home-Screen standalone window.
     Without this, tapping an internal link hands off to Safari and the URL bar
     reappears. External / target=_blank links fall through to the Safari overlay. */
  (function () {
    var standalone = ("standalone" in window.navigator) && window.navigator.standalone;
    if (/[?&]diag=1/.test(location.search)) {
      window.addEventListener("DOMContentLoaded", function () {
        var b = document.createElement("div");
        b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;font:12px/1.45 monospace;color:#fff;padding:6px 10px;white-space:pre;background:" + (standalone ? "#0a7d4b" : "#c0392b");
        b.textContent = "navigator.standalone: " + standalone + "   display-mode: " + matchMedia("(display-mode: standalone)").matches + "\npage: " + location.pathname.split("/").pop() + "   referrer: " + (document.referrer || "(none)");
        b.addEventListener("click", function () { b.remove(); });
        document.body.appendChild(b);
      });
    }
    if (!standalone) return;
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a || a.target === "_blank") return;
      if (a.host && a.host !== location.host) return;          // external link
      if (/^(mailto:|tel:|sms:)/i.test(a.getAttribute("href"))) return;
      e.preventDefault();
      var url = a.href;
      if (/[?&]diag=1/.test(location.search) && url.indexOf("diag=1") === -1) url += (url.indexOf("?") === -1 ? "?" : "&") + "diag=1";
      location.href = url;                                  // stay in standalone
    }, false);
  })();

<style>
  :root {
    --surface: #ffffff;
    --page-bg: #f8f9fb;
    --navy: #1a2e50;
    --navy-soft: rgba(26, 46, 80, 0.08);

  /* ---------- Hero card ---------- */

  /* ---------- Standings ---------- */

    font-family: var(--display); font-weight: 700; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .ct-status.locked { background: var(--navy); color: #fff; }
  .ct-status.new    { background: var(--gold); color: var(--navy); }
  .ct-status.held   { background: #eceff4; color: var(--muted); }
  .ct-legend {
    font-family: var(--body); font-size: 12px; color: var(--muted);
    margin: 0 0 12px; line-height: 1.8;
  }

  /* ---------- News headline (top card preview) ---------- */
  .news-headline {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    color: var(--navy);
    line-height: 1.25;
    margin-bottom: 8px;
  }

  /* ---------- Elite 5 ---------- */
  .elite-list { display: flex; flex-direction: column; gap: 10px; }
  .elite-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 12px;
    background: var(--page-bg);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .elite-rank {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
  }
  .elite-main { flex: 1 1 auto; min-width: 0; }
  .elite-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    color: var(--navy);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tier-badge {
    font-family: var(--display);
    font-weight: 700;
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 3px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tier-badge.U { background: var(--navy); color: #fff; }
  .tier-badge.L { background: var(--gold-soft); color: var(--gold-dark); border: 1px solid var(--gold); }
  .elite-owner {
    font-family: var(--body);
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-top: 2px;
  }
  .elite-note {
    font-family: var(--body);
    font-size: 13px;
    color: var(--navy);
    font-style: italic;
    margin-top: 4px;
    line-height: 1.4;
  }

  .elite-stat { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--gold-dark); letter-spacing: 0.03em; margin-top: 2px; }

  /* ---------- Post-Season Picture ---------- */
  .ps-tier + .ps-tier { margin-top: 18px; }
  .ps-group { padding: 10px 0; border-top: 1px solid var(--border); }
  .ps-group:first-of-type { border-top: 0; }
  .ps-group-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--navy);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
  }
  .ps-pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .ps-team { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--body); font-size: 13px; }
  .ps-seed {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
    background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; font-size: 12px;
  }
  .ps-rec { color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .ps-vs { font-family: var(--display); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .ps-badge { font-family: var(--display); font-weight: 700; font-size: 10px; padding: 2px 7px; border-radius: 999px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .ps-badge.safe      { background: rgba(29,158,117,.12); color: var(--win); }
  .ps-badge.promoted  { background: var(--win); color: #fff; }
  .ps-badge.tbd       { background: var(--gold-soft); color: var(--gold-dark); border: 1px solid var(--gold); }
  .ps-badge.relegated { background: var(--loss); color: #fff; }
  .ps-cr { font-family: var(--display); font-weight: 700; font-size: 11px; color: var(--gold-dark);
           letter-spacing: 0.03em; white-space: nowrap; }
  .ps-foot { font-family: var(--body); font-size: 11px; font-style: italic; color: var(--muted); margin: 12px 0 0; }
  @media (max-width: 767px) {
    .ps-pair { flex-direction: column; align-items: flex-start; gap: 4px; }
    .ps-pair + .ps-pair { margin-top: 6px; }
  }

  /* ---------- Bracket placeholder ---------- */
  .bracket-placeholder {
    padding: 20px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: var(--page-bg);
    font-family: var(--body);
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- News reel ---------- */
  .news-list { display: flex; flex-direction: column; }
  .news-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-family: var(--body);
    font-size: 14px;
    color: var(--navy);
    line-height: 1.45;
  }
  .news-list li:first-child { border-top: 0; }
  .news-subhead {
    font-family: var(--body);
    font-size: 14px;
    color: var(--navy);
    line-height: 1.4;
    margin: -2px 0 8px;
  }
  .news-lead { margin-bottom: 6px; }
  .news-section-head {
    font-family: var(--display);
    font-weight: 700;
    font-size: 12px;
    color: var(--gold-dark);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 4px 0 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .news-section + .news-section { margin-top: 14px; }
  /* Highlighter stroke under team names, so an owner's eye finds their own team. */
  .team-chip {
    font-weight: 700;
    background: linear-gradient(transparent 60%, rgba(245, 166, 35, 0.38) 60%);
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    padding: 0 1px;
  }
  .news-list .bullet {
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--navy);
    margin-top: 8px;
  }

  /* ---------- Off-season state ---------- */
  .offseason-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 6px 18px var(--navy-soft);
  }
  .offseason-head {
    font-family: var(--display);
    font-weight: 700;
    font-size: 26px;
    color: var(--navy);
    margin: 0 0 12px;
    line-height: 1.2;
  }
  .offseason-sub {
    font-family: var(--body);
    font-size: 15px;
    color: var(--muted);
    margin: 0 auto 28px;
    max-width: 480px;
    line-height: 1.5;
  }
  .offseason-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 14px 22px;
    background: var(--gold);
    color: var(--navy);
    border-radius: 8px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 4px 14px var(--navy-shadow);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .offseason-cta:hover {
    background: var(--gold-dark);
    box-shadow: 0 6px 18px var(--navy-shadow-strong);
  }

  /* ---------- Footer ---------- */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 32px 24px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center;
    font-family: var(--body);
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .site-footer > div + div { margin-top: 4px; }

  /* ---------- Responsive ---------- */
  /* ---------- Week 0: neutral streak ---------- */
  .streak.none { background: #eceff4; color: var(--muted); }

  /* ---------- Draft Recap ---------- */
  .recap-method {
    font-family: var(--body);
    font-size: 13px;
    line-height: 1.55;
    color: var(--navy);
    margin: 0 0 14px;
  }
  .recap-chars {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 0 0 18px;
  }
  .recap-chars li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 10px 12px;
    background: var(--page-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .recap-chars .cnum {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    color: var(--gold-dark);
    flex: 0 0 auto;
    min-width: 42px;
  }
  .recap-chars .ctxt { font-family: var(--body); font-size: 12px; line-height: 1.45; color: var(--navy); }

  .recap-tier-label {
    padding: 8px 4px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
  }
  .recap-tier-sub { color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }

  .sup-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 10px 0 16px;
  }
  .sup {
    background: var(--page-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-width: 0;
  }
  .sup-label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .sup.buy .sup-label { color: var(--gold-dark); }
  .sup.value .sup-label { color: var(--win); }
  .sup.reach .sup-label { color: var(--loss); }
  .sup-subject {
    font-family: var(--body);
    font-weight: 700;
    font-size: 14px;
    color: var(--navy);
    margin-top: 6px;
    line-height: 1.2;
  }
  .sup-value {
    font-family: var(--display);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.1;
    color: var(--navy);
    margin: 2px 0 2px;
  }
  .sup.buy .sup-value { color: var(--gold-dark); }
  .sup.value .sup-value { color: var(--win); }
  .sup.reach .sup-value { color: var(--loss); }
  .sup-team { font-family: var(--body); font-size: 11px; color: var(--muted); }
  .sup-note {
    font-family: var(--body);
    font-size: 12px;
    line-height: 1.45;
    color: var(--navy);
    margin: 9px 0 0;
    padding-top: 9px;
    border-top: 1px solid var(--border);
  }

  .grade-legend {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 0 4px 8px;
    font-family: var(--body);
    font-size: 11px;
    color: var(--muted);
  }
  .grade-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .grade-legend .sw.under { background: var(--win); }
  .grade-legend .sw.over { background: var(--loss); }
  .grade-legend-note { font-style: italic; }

  .grade-row {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) 140px;
    gap: 10px;
    align-items: start;
    padding: 10px 4px;
    border-top: 1px solid var(--border);
  }
  /* No :first-of-type reset — the legend sits directly above, so the first row's
     top border reads as the divider under it. Intentional. */
  .grade {
    font-family: var(--display);
    font-weight: 700;
    font-size: 12px;
    text-align: center;
    padding: 3px 0;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .gA { background: rgba(29, 158, 117, 0.14); color: var(--win); }
  .gB { background: #eceff4; color: var(--navy); }
  .gC { background: rgba(192, 74, 74, 0.12); color: var(--loss); }
  .grade-team { font-family: var(--body); font-weight: 700; font-size: 14px; color: var(--navy); }
  .grade-owner { font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 4px; }
  .grade-note { font-family: var(--body); font-size: 12px; line-height: 1.45; color: var(--navy); margin-top: 3px; }
  .grade-mkt { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding-top: 4px; }
  .track { position: relative; display: block; flex: 1 1 auto; min-width: 60px; height: 8px; background: #eceff4; border-radius: 2px; }
  .zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--border); }
  .bar { position: absolute; top: 0; height: 8px; border-radius: 2px; }
  .bar.under { background: var(--win); }
  .bar.over { background: var(--loss); }
  .vm { font-family: var(--display); font-weight: 700; font-size: 13px; flex: 0 0 auto; min-width: 46px; text-align: right; }
  .vm.under { color: var(--win); }
  .vm.over { color: var(--loss); }

  /* ---------- Week 1 Preview ---------- */
  .mu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .mu {
    background: var(--page-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-width: 0;
  }
  .mu.ghost { border-color: var(--gold); border-left: 3px solid var(--gold); }
  .mu-teams { display: flex; align-items: flex-start; gap: 10px; }
  .mu-side { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .mu-side.right { text-align: right; }
  .mu-team {
    font-family: var(--body);
    font-weight: 700;
    font-size: 13px;
    color: var(--navy);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mu-owner { font-family: var(--body); font-size: 11px; color: var(--muted); }
  .mu-vs {
    font-family: var(--display);
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    flex: 0 0 auto;
    padding-top: 2px;
  }
  .mu-note {
    font-family: var(--body);
    font-size: 12px;
    line-height: 1.45;
    color: var(--navy);
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  /* ---------- Results ---------- */
  .mu-tag {
    display: inline-block;
    font-family: var(--display);
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .mu-score {
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    margin-top: 4px;
    color: var(--navy);
  }
  .mu-side.won .mu-score { color: var(--gold-dark); }
  .mu-side.lost .mu-team,
  .mu-side.lost .mu-score { color: var(--muted); }
  .mu-side.lost .mu-score { font-weight: 600; }
  .mu.result .mu-vs { padding-top: 4px; }

  /* ---------- Ghost standings row ---------- */
  .row.ghost .record,
  .row.ghost .team-name,
  .row.ghost .pts { color: var(--muted); }
  .row.ghost .team-name::before { content: "👻 "; }
  .row.ghost .streak { opacity: 0.55; }
  .row.ghost .cr { visibility: hidden; }

  /* ---------- Week 0 misc ---------- */
  .survivor-note {
    font-family: var(--body);
    font-size: 13px;
    line-height: 1.5;
    color: var(--navy);
    font-style: italic;
    margin: 0 0 14px;
  }
  .ct-unclaimed { font-family: var(--body); font-size: 13px; color: var(--muted); font-style: italic; }


  /* ---------- Tile layout (v6.0) ---------- */
  /* Two columns at every width. News and Elite 5 span the row; everything else
     is a half-width tile until tapped, when it opens across the full row. */
  .card-grid { grid-auto-flow: row dense; align-items: stretch; }
  .pulse-card { scroll-margin-top: 84px; }
  .pulse-card.span-2 { grid-column: 1 / -1; }
  .pulse-card.tile:not(.open) .card-preview .tap { display: none; }
  .tile-stats { display: flex; gap: 14px; }
  .tile-stats > div { display: flex; flex-direction: column; }
  .tile-num { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--navy); }
  .tile-of { font-size: 14px; color: var(--muted); }
  .tile-lbl { font-family: var(--display); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 3px; }
  .tile-sub { margin-top: 8px; font-size: 13px; line-height: 1.35; }

  /* ---------- Post-season seed tags ---------- */
  .ps-how { font-family: var(--display); font-weight: 700; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
            padding: 1px 5px; border-radius: 3px; background: var(--navy); color: #fff; white-space: nowrap; }
  .ps-how.wc { background: var(--gold-soft); color: var(--gold-dark); border: 1px solid var(--gold); }

  /* ---------- Elite 5 stat boxes + traits ---------- */
  .elite-strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .elite-strip li { display: inline-flex; align-items: center; gap: 6px; font-family: var(--body); font-weight: 700; font-size: 13px;
                    background: var(--page-bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 4px; }
  .es-rank { width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; display: inline-flex;
             align-items: center; justify-content: center; font-family: var(--display); font-size: 11px; }
  .elite-stats { display: flex; gap: 6px; margin-top: 8px; }
  .es { flex: 1 1 0; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
        display: flex; flex-direction: column; }
  .es-v { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.1; color: var(--navy); }
  .es-l { font-family: var(--display); font-weight: 700; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .elite-traits { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .trait { font-family: var(--display); font-weight: 700; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
           padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .trait.gold { background: var(--gold); color: var(--navy); }
  .trait.hot  { background: rgba(29, 158, 117, 0.14); color: var(--win); }
  .trait.cool { background: #eceff4; color: var(--navy); }
  .trait.warn { background: rgba(192, 74, 74, 0.12); color: var(--loss); }

  /* ---------- Preview: tags, meta, rivalry strip, rest of slate ---------- */
  .mu-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .mu-chip { font-family: var(--display); font-weight: 700; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
             padding: 2px 7px; border-radius: 999px; background: #eceff4; color: var(--navy); white-space: nowrap; }
  .mu-chip.div { background: var(--navy); color: #fff; }
  .mu-chip.hot { background: rgba(29, 158, 117, 0.14); color: var(--win); }
  .mu-chip.rvx { background: var(--gold-soft); color: var(--gold-dark); border: 1px solid var(--gold); }
  .mu-meta { font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--navy); margin-top: 2px; letter-spacing: 0.02em; }
  .rv-inline { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px;
               font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.02em;
               color: var(--gold-dark); }
  .rv-inline.plain { color: var(--muted); min-height: 0; margin-top: 8px; }
  .sl-head { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
             color: var(--muted); margin: 4px 0 6px; }
  .slate { margin: 0 0 14px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .slate li + li { border-top: 1px solid var(--border); }
  .sl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 8px 10px;
            background: var(--page-bg); }
  .sl-teams { min-width: 0; font-family: var(--body); font-size: 13px; line-height: 1.3; }
  .sl-team { font-weight: 700; }
  .sl-own { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .sl-vs { font-family: var(--display); font-weight: 700; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .sl-h2h { flex: 0 0 auto; font-family: var(--display); font-weight: 700; font-size: 11px; color: var(--gold-dark); text-align: right; max-width: 42%; }

  @media (max-width: 1024px) {
    .site-nav { gap: 16px; }
    .site-nav a { font-size: 12px; }
  }

  @media (max-width: 767px) {
    .header-inner { padding: 12px 18px; }
    .brand-logo { height: 40px; }
    .brand-wordmark { font-size: 20px; }

    .nav-toggle { display: inline-flex; align-items: center; justify-content: center; }

    .site-nav {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;

/* --------- HELPERS --------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
/* Canonical owner short names — keyed by normalizeName() of the data display
   form. Every owner here is rendered beside its own team element, so the team
   stays put (team-forward) and only the owner collapses to a short name, e.g.
   "Reilly's Reindeer · Joe". Falls back to the full name when unmapped. */
function normalizeName(s) {
  return String(s == null ? "" : s)
    .replace(/\s+/g, " ").replace(/\s*\/\s*/g, " / ").trim().toLowerCase();
}
const SHORT_NAMES = {
  "joe reilly":"Joe","brian murello / ron murello":"Brian/Ron",
  "jon murello / rick simmons":"Jon/Rick","mike murello":"Mike",
  "david murello":"Dave","todd trozzo":"Troz","tony trozzo":"Tony",
  "chris johnson":"Johnson","jacob nickman":"Jake","bj funari":"BJ",
  "ben funari":"Ben","bob keslar":"Bo","dan reilly":"Dan",
  "jon fetrow":"Fetrow",
  "ed peters":"Ed","tony brooks":"Brooks",
  "braiden snyder":"Braiden","charles lavrinc":"Charlie","sam lavrinc":"Sam",
  "nick yankovich":"Nick","dominic nicastro":"Dom"
};
const shortName = fullName => SHORT_NAMES[normalizeName(fullName)] || fullName;
const teamOwner = t => `${esc(t.team)} (${esc(shortName(t.owner))})`;
function streakLabel(n) {
  if (n > 0) return "W" + n;
  if (n < 0) return "L" + Math.abs(n);
  return "—";
}
function streakClass(n) { return n >= 0 ? "w" : "l"; }

const GHOST_TEAM = "MAFFL Ghost";

/* The Ghost is a schedule filler, not a competitor — it never affects promotion
   or relegation, so it sorts below every real team in every week regardless of
   its record. Wraps whichever comparator the week uses. */
function ghostLast(cmp) {
  return (a, b) => {
    const ag = a.team === GHOST_TEAM, bg = b.team === GHOST_TEAM;
    if (ag && !bg) return 1;
    if (bg && !ag) return -1;
    return cmp(a, b);
  };
}

/* Week 0 has no games, so standings rank by credit balance, highest first, ties
   alphabetical. Every other week uses standingsSort (wins, losses, points, then
   credits). The Ghost sorts last in both. */
function pulseSort(week) {
  if (week && week.weekNumber === 0) {
    return ghostLast((a, b) => {
      if (b.credits !== a.credits) return b.credits - a.credits;
      return a.team.localeCompare(b.team);
    });
  }
  return ghostLast(standingsSort);
}

function weekLabel(w) { return w.label || ("Week " + w.weekNumber); }

/* Standings order follows the rulebook's General tiebreaker so the Standings
   and Post-Season cards always agree: record (W/L %), then credit balance, then
   total points for. Array sort is stable, so exact ties hold authored order. */
function standingsSort(a, b) { return seedSort(a, b); }
/* Rulebook General tiebreaker: record (W/L %), then credit balance, then total
   points for. Used for overall standings, seeding and the Wild Card race. */
function winPct(t) { const g = t.w + t.l + (t.t || 0); return g ? (t.w + 0.5 * (t.t || 0)) / g : 0; }
function seedSort(a, b) {
  if (winPct(b) !== winPct(a)) return winPct(b) - winPct(a);
  if ((b.credits || 0) !== (a.credits || 0)) return (b.credits || 0) - (a.credits || 0);
  return b.points - a.points;
}

/* Division record: games in weeks 1..week between two teams that sit in the
   same Upper division this week. */
function divisionMap(week) {
  const m = {};
  if (!week || !week.upperTier) return m;
  ["divA", "divB", "divC", "divD"].forEach(k => (week.upperTier[k] || []).forEach(t => { m[t.team] = k; }));
  return m;
}
function divisionRecord(teamName, week) {
  const dm = divisionMap(week), rec = { w: 0, l: 0 };
  WEEKS.forEach(wk => {
    if (wk.weekNumber < 1 || wk.weekNumber > week.weekNumber) return;
    (wk.results || []).forEach(g => {
      if (g.tier !== "U" || !dm[g.teamA] || dm[g.teamA] !== dm[g.teamB]) return;
      if (g.teamA === teamName) { g.scoreA > g.scoreB ? rec.w++ : g.scoreA < g.scoreB ? rec.l++ : 0; }
      if (g.teamB === teamName) { g.scoreB > g.scoreA ? rec.w++ : g.scoreB < g.scoreA ? rec.l++ : 0; }
    });
  });
  return rec;
}
/* Rulebook Division tiebreaker: record, credit balance, division record, points. */
function divSort(week) {
  return (a, b) => {
    if (winPct(b) !== winPct(a)) return winPct(b) - winPct(a);
    if ((b.credits || 0) !== (a.credits || 0)) return (b.credits || 0) - (a.credits || 0);
    const da = winPct(divisionRecord(a.team, week)), db = winPct(divisionRecord(b.team, week));
    if (db !== da) return db - da;
    return b.points - a.points;
  };
}
const divLetter = k => k ? k.slice(3) : "";

/* All-play record: every week through uptoWeek, the team's score against every
   other real score in its tier that week. The Ghost's par score is not a team. */
function allPlay(teamName, tier, uptoWeek) {
  const rec = { w: 0, l: 0, t: 0 };
  WEEKS.forEach(wk => {
    if (wk.weekNumber < 1 || wk.weekNumber > uptoWeek || !wk.results || !wk.results.length) return;
    const scores = [];
    wk.results.filter(g => g.tier === tier).forEach(g => {
      if (g.teamA !== GHOST_TEAM) scores.push({ team: g.teamA, score: g.scoreA });
      if (g.teamB !== GHOST_TEAM) scores.push({ team: g.teamB, score: g.scoreB });
    });
    const mine = scores.find(s => s.team === teamName);
    if (!mine) return;
    scores.forEach(s => {
      if (s === mine) return;
      if (mine.score > s.score) rec.w++;
      else if (mine.score < s.score) rec.l++;
      else rec.t++;
    });
  });
  return rec;
}

/* Wraps every real team name from the week's standings in a highlighter chip.
   Text around the matches is escaped piece by piece; the chip markup itself is
   never passed through esc(). */
function chipTeams(text, week) {
  const s = String(text == null ? "" : text);
  if (!week || !week.upperTier || !week.lowerTier) return esc(s);
  const u = week.upperTier;
  const names = [...(u.divA || []), ...(u.divB || []), ...(u.divC || []), ...(u.divD || []), ...week.lowerTier]
    .map(t => t.team)
    .filter(n => n && n !== GHOST_TEAM)
    .sort((a, b) => b.length - a.length);
  if (!names.length) return esc(s);
  const re = new RegExp("(" + names.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g");
  /* split() with one capture group alternates plain text (even) and match (odd). */
  return s.split(re).map((piece, i) =>
    i % 2 ? `<span class="team-chip">${esc(piece)}</span>` : esc(piece)
  ).join("");
}

/* Legacy weeks (0–2) carry a flat string array. Treat it as one untitled section. */
function newsSections(week) {
  const r = week.newsReel || [];
  if (!r.length) return [];
  return typeof r[0] === "string" ? [{ section: null, icon: null, items: r }] : r;
}
function newsItems(week) { return newsSections(week).flatMap(s => s.items || []); }

function getWeekFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get("week");
  if (!raw) return null;
  const n = parseInt(raw, 10);
  return isNaN(n) ? null : n;
}
function findWeek(weekNumber) {
  return WEEKS.find(w => w.weekNumber === weekNumber) || null;
}
function leaderOfTier(divs) {
  const all = [...divs.divA, ...divs.divB, ...divs.divC, ...divs.divD];
  return all.slice().sort((a, b) => {
    if (b.w !== a.w) return b.w - a.w;
    if (a.l !== b.l) return a.l - b.l;
    return b.points - a.points;
  })[0];
}

/* --------- RENDER: HERO + GRID --------- */
function renderPage(week) {
  const main = document.getElementById("pulseMain");
  const hasStandings = !!(week.upperTier && week.lowerTier && week.lowerTier.length);
  const hasSurvivor  = !!(week.survivor && week.survivor.upperActive);
  const hasElite     = !!(week.elite5 && week.elite5.length) || week.weekNumber >= 14
                       || !!(week.weekNumber === 0 && week.draftRecap);
  /* Week 0 leads with the auction recap — it is the marquee item of the
     post-draft edition and must not land last in the grid. */
  const cards = week.weekNumber === 0
    ? [renderNewsCard(week),
       hasElite ? renderElite5Card(week) : "",
       hasStandings ? renderStandingsCard(week) : "",
       renderPreviewCard(week),
       hasSurvivor ? renderSurvivorCard(week) : "",
       renderCreditTrackerCard(week)]
    /* Tile layout: News is a full-width banner, then pairs —
       Standings | Post-Season, Survivor | Credit Tracker, Results | Preview —
       and Elite 5 closes as a full-width row. */
    : [renderNewsCard(week),
       hasStandings ? renderStandingsCard(week) : "",
       hasStandings && week.weekNumber >= 1 && week.weekNumber <= 13 ? renderPostseasonCard(week) : "",
       hasSurvivor ? renderSurvivorCard(week) : "",
       renderCreditTrackerCard(week),
       renderResultsCard(week),
       renderPreviewCard(week),
       hasElite ? renderElite5Card(week) : ""];
  main.innerHTML = `
    <section class="card-grid" id="cardGrid" aria-label="Pulse sections">
      ${cards.join("")}
    </section>
  `;
  wireCards();
  wireStandingsCollapsibles();
}

/* --------- STANDINGS CARD --------- */
function renderStandingsCard(week) {
  const upperAll = [
    ...week.upperTier.divA, ...week.upperTier.divB,
    ...week.upperTier.divC, ...week.upperTier.divD
  ].slice().sort(pulseSort(week));
  const topTwoUpper = upperAll.slice(0, 2);
  const lowerLeader = week.lowerTier.slice().sort(pulseSort(week))[0];
  const isWk0 = week.weekNumber === 0;

  const freshSlate = upperAll.concat(week.lowerTier)
    .every(t => t.w === 0 && t.l === 0);
  const preview = isWk0
    ? `
      <div><span class="strong">Upper:</span> ${teamOwner(upperAll[0])} ${upperAll[0].credits} CR</div>
      <div style="margin-top:4px"><span class="strong">Lower:</span> ${teamOwner(lowerLeader)} ${lowerLeader.credits} CR</div>
      <div class="muted-line">No games played — Week 0 ranks by credit balance. Tap for full standings.</div>
    `
    : freshSlate
    ? `
      <div><span class="strong">Everybody's 0-0.</span></div>
      <div style="margin-top:4px">Divisions seeded by offseason credit balance.</div>
      <div class="muted-line tap">Tap for the full board.</div>
    `
    : `
      <div><span class="strong">Upper:</span> ${teamOwner(topTwoUpper[0])} ${topTwoUpper[0].w}-${topTwoUpper[0].l}</div>
      <div style="margin-top:4px"><span class="strong">Lower:</span> ${teamOwner(lowerLeader)} ${lowerLeader.w}-${lowerLeader.l}</div>
      <div class="muted-line tap">Tap for full standings.</div>
    `;

  const upperBody = `
    <div class="tier-block">
      <button class="tier-head" data-toggle="tier" aria-expanded="false">
        <span>Upper-Tier</span><span class="chev" aria-hidden="true">&#9662;</span>
      </button>
      <div class="tier-body">
        ${renderDivStatic("Division A", week.upperTier.divA, week)}
        ${renderDivStatic("Division B", week.upperTier.divB, week)}
        ${renderDivStatic("Division C", week.upperTier.divC, week)}
        ${renderDivStatic("Division D", week.upperTier.divD, week)}
      </div>
    </div>
    <div class="tier-block">
      <button class="tier-head" data-toggle="tier" aria-expanded="false">
        <span>Lower-Tier</span><span class="chev" aria-hidden="true">&#9662;</span>
      </button>
      <div class="tier-body">
        ${renderRanked(week.lowerTier, week)}
      </div>
    </div>
  `;

  return cardShell("standings", "📊", "Standings", preview, upperBody);
}

/* --------- POST-SEASON PICTURE CARD ("if the season ended today") --------- */
/* Fully derived from the week's standings — no authored bracket data.
   Upper: the four division winners (Division tiebreaker) take seeds 1–4, ordered
   among themselves by the General tiebreaker; the best two remaining records are
   the Wild Cards (5–6); 7–12 follow by the General tiebreaker. Optional
   week.relegationInsurance lifts an insured team sitting at 7–12 to seed 7.
   Lower: seeds 1–9 by the General tiebreaker, Ghost excluded. */
function postseasonSeeds(week) {
  const u = week.upperTier;
  const dm = divisionMap(week);
  const winners = ["divA", "divB", "divC", "divD"]
    .map(k => (u[k] || []).slice().sort(divSort(week))[0])
    .filter(Boolean).sort(seedSort);
  const rest = [...u.divA, ...u.divB, ...u.divC, ...u.divD]
    .filter(t => !winners.includes(t)).sort(seedSort);
  let upper = winners.concat(rest);
  const insured = week.relegationInsurance || [];
  if (insured.length) {
    const top = upper.slice(0, 6), low = upper.slice(6);
    upper = top.concat(low.filter(t => insured.includes(t.team)), low.filter(t => !insured.includes(t.team)));
  }
  upper = upper.map((t, i) => Object.assign({}, t, {
    seed: i + 1,
    how: i < winners.length ? "Div " + divLetter(dm[t.team]) : (i < 6 ? "WC" : "")
  }));
  const lower = week.lowerTier.filter(t => t.team !== GHOST_TEAM).slice().sort(seedSort)
    .map((t, i) => Object.assign({}, t, { seed: i + 1, how: "" }));
  return { upper, lower };
}
function seedOf(week, team) {
  const { upper, lower } = postseasonSeeds(week);
  const t = upper.concat(lower).find(x => x.team === team);
  return t ? t.seed : null;
}

function renderPostseasonCard(week) {
  const { upper, lower } = postseasonSeeds(week);
  const at = (list, seed) => list[seed - 1];
  const psTeam = (list, seed) => {
    const t = at(list, seed);
    if (!t) return "";
    const how = t.how ? `<span class="ps-how${t.how === "WC" ? " wc" : ""}">${esc(t.how)}</span>` : "";
    return `<div class="ps-team"><span class="ps-seed">${seed}</span><span>${teamOwner(t)}</span><span class="ps-rec">${t.w}-${t.l}</span><span class="ps-cr">${t.credits || 0} CR</span>${how}</div>`;
  };
  const psPair = (list, a, b) => `
    <div class="ps-pair">${psTeam(list, a)}<span class="ps-vs">vs</span>${psTeam(list, b)}</div>`;
  const psGroup = (title, badgeClass, badgeText, inner) => `
    <div class="ps-group">
      <div class="ps-group-head"><span>${esc(title)}</span><span class="ps-badge ${badgeClass}">${esc(badgeText)}</span></div>
      ${inner}
    </div>`;

  const upperHtml = tierAccordion("Upper-Tier", `
    <div class="ps-tier">
      ${psGroup("Championship — First-Round Bye", "safe", "Bye",
          `<div class="ps-pair">${psTeam(upper, 1)}</div><div class="ps-pair">${psTeam(upper, 2)}</div>`)}
      ${psGroup("Championship — Wild Card Round", "safe", "Playoffs", psPair(upper, 4, 5) + psPair(upper, 3, 6))}
      ${psGroup("Consolation · Best of 3", "safe", "Safe", psPair(upper, 7, 8))}
      ${psGroup("Relegation Showdown · Best of 3", "tbd", "Showdown", psPair(upper, 9, 10))}
      ${psGroup("Consolation · Best of 3", "relegated", "Relegated", psPair(upper, 11, 12))}
    </div>`);
  const lowerHtml = tierAccordion("Lower-Tier", `
    <div class="ps-tier">
      ${psGroup("Promotion Consolation · Best of 3", "promoted", "Promoted", psPair(lower, 1, 2))}
      ${psGroup("Promotion Showdown · Best of 3", "tbd", "Showdown", psPair(lower, 3, 4))}
      ${psGroup("Safe", "safe", "Stays Lower",
          lower.slice(4).map((t, i) => `<div class="ps-pair">${psTeam(lower, i + 5)}</div>`).join(""))}
    </div>`);

  const preview = `
    <div><span class="strong">Byes:</span> ${[at(upper, 1), at(upper, 2)].filter(Boolean).map(teamOwner).join(", ")}</div>
    <div style="margin-top:4px"><span class="strong">Promoted:</span> ${[at(lower, 1), at(lower, 2)].filter(Boolean).map(teamOwner).join(", ")}</div>
    <div class="muted-line tap">Tap for the projected bracket, showdowns and relegation line.</div>
  `;
  const body = `
    ${week.postseasonNote ? `<p class="survivor-note">${esc(week.postseasonNote)}</p>` : ""}
    ${upperHtml}
    ${lowerHtml}
    <p class="ps-foot">If the season ended today. Upper: the four division winners take seeds 1–4 (Div); the next two best records are the Wild Cards (WC). Tied records are split by credit balance (CR), then points. Division ties add division record before points. All 3-game series are first to 2 wins.</p>
  `;
  return cardShell("postseason", "🏆", "Post-Season Picture", preview, body);
}

function renderDivStatic(name, teams, week) {
  const sorted = teams.slice().sort(week.weekNumber === 0 ? pulseSort(week) : divSort(week));
  return `
    <div class="div-block">
      <div class="div-label">${esc(name)}</div>
      <div class="div-body div-body--static">
        ${sorted.map(t => row(t, week)).join("")}
      </div>
    </div>
  `;
}

function renderRanked(teams, week) {
  const sorted = teams.slice().sort(pulseSort(week));
  return sorted.map(t => row(t, week)).join("");
}

function row(t, week) {
  /* Week 0 has no games, so a 0 streak is "none", not a win streak — a green
     pill behind an em dash reads as a result nobody has earned yet. */
  const sClass = (week && week.weekNumber === 0) ? "none" : streakClass(t.streak);
  const isGhost = t.team === GHOST_TEAM;
  return `
    <div class="row${isGhost ? " ghost" : ""}">
      <div class="record">${t.w}-${t.l}</div>
      <div class="mid">
        <span class="team-name">${esc(t.team)}</span>
        <span class="owner">${esc(shortName(t.owner))}</span>
      </div>
      <div class="meta">
        <span class="pts">${t.points.toFixed(1)}<span class="pts-label">PF</span></span>
        <span class="streak ${sClass}">${streakLabel(t.streak)}</span>
        <span class="cr">${t.credits}<span class="cr-label">CR</span></span>
      </div>
    </div>
  `;
}

/* --------- SURVIVOR CARD --------- */
function renderSurvivorCard(week) {
  const s = week.survivor;
  const upperAlive = s.upperActive.length;
  const lowerAlive = s.lowerActive.length;
  const bothDone = s.upperConcluded && s.lowerConcluded;

  if (bothDone) {
    const summary = `
      <div class="survivor-summary">
        <div class="label">Survivor</div>
        <div>Upper won by <span class="strong">${esc(s.upperWinner || "—")}</span></div>
        <div>Lower won by <span class="strong">${esc(s.lowerWinner || "—")}</span></div>
      </div>
    `;
    return cardShell("survivor", "💀", "Survivor", summary, summary, /*alwaysCollapsed=*/true);
  }

  const recentUpper = s.upperEliminated.filter(e => e.recent);
  const recentLower = s.lowerEliminated.filter(e => e.recent);
  const recentLine = (recentUpper.length || recentLower.length)
    ? `<div class="tile-sub"><span class="strong">Out:</span> ${[...recentUpper, ...recentLower].map(e => esc(e.team)).join(", ")}</div>`
    : `<div class="tile-sub">No fresh skulls this week.</div>`;

  const preview = `
    <div class="tile-stats">
      <div><span class="tile-num">${upperAlive}</span><span class="tile-lbl">alive · Upper</span></div>
      <div><span class="tile-num">${lowerAlive}</span><span class="tile-lbl">alive · Lower</span></div>
    </div>
    ${recentLine}
  `;

  const noteBlock = week.survivorNote ? `<p class="survivor-note">${esc(week.survivorNote)}</p>` : "";
  const body = `
    ${noteBlock}
    <div class="survivor-grid">
      ${survivorPool("Upper-Tier", s.upperActive, s.upperEliminated, s.upperConcluded, s.upperWinner)}
      ${survivorPool("Lower-Tier", s.lowerActive, s.lowerEliminated, s.lowerConcluded, s.lowerWinner)}
    </div>
  `;

  return cardShell("survivor", "💀", "Survivor", preview, body);
}

function survivorPool(title, active, eliminated, concluded, winner) {
  const activeRows = active.map(t => {
    const isWinner = concluded && winner && t === winner;
    return `
      <li class="${isWinner ? "winner" : ""}">
        <span class="dot"></span>
        <span>${esc(t)}</span>
        ${isWinner ? '<span class="winner-tag">WINNER</span>' : ""}
      </li>
    `;
  }).join("");

  const eliminatedRows = eliminated
    .slice()
    .sort((a, b) => b.week - a.week)
    .map(e => `
      <li class="${e.recent ? "recent" : "eliminated"}">
        <span class="dot"></span>
        <span>${esc(e.team)}</span>
        ${e.recent ? '<span class="out-tag">OUT</span>' : `<span class="out-tag" style="background:var(--muted)">WK ${e.week}</span>`}
      </li>
    `).join("");

  return `
    <div class="survivor-pool">
      <div class="pool-head">
        <span class="pool-head-left">
          <span>${esc(title)}</span>
          <span class="credit-pill">+5 credits</span>
        </span>
        <span class="pool-count">${active.length} alive</span>
      </div>
      <ul class="pool-list">
        ${activeRows}
        ${eliminatedRows}
      </ul>
    </div>
  `;
}

/* --------- CREDIT TRACKER CARD --------- */
/* Optional status pill: locked (final) or leading (can still change). Absent on
   weeks authored before the field existed, so those render unchanged. */
function ctStatus(item, week) {
  if (item.status === "locked") return `<span class="ct-status locked">🔒 Locked</span>`;
  if (item.status === "leading") {
    return item.since === week.weekNumber
      ? `<span class="ct-status new">New leader</span>`
      : `<span class="ct-status held">Leader since Wk ${esc(item.since)}</span>`;
  }
  return "";
}

function ctCell(item, week) {
  if (!item) return `<div class="ct-col"></div>`;
  /* An unawarded category has no leader yet — rendering "— (—)" reads as a bug
     rather than as an empty slot, so show the status line on its own. */
  if (item.leaderTeam === "—") {
    return `
      <div class="ct-col">
        <span class="tier-badge ${item.tier}">${item.tier === "U" ? "Upper" : "Lower"}</span>
        ${ctStatus(item, week)}
        <div class="ct-unclaimed">${esc(item.value)}</div>
        <span class="credit-pill">+${item.credits} credits</span>
      </div>
    `;
  }
  const tier = item.tier; // "U" or "L"
  return `
    <div class="ct-col">
      <span class="tier-badge ${tier}">${tier === "U" ? "Upper" : "Lower"}</span>
      ${ctStatus(item, week)}
      <div class="ct-leader"><span class="strong">${esc(item.leaderTeam)}</span> (${esc(shortName(item.leaderOwner))})</div>
      <div class="ct-value">${esc(item.value)}</div>
      <span class="credit-pill">+${item.credits} credits</span>
    </div>
  `;
}

function hwCell(side, tier) {
  return `
    <div class="ct-col">
      <span class="tier-badge ${tier}">${tier === "U" ? "Upper" : "Lower"}</span>
      <div class="ct-leader"><span class="strong">${esc(side.team)}</span> (${esc(shortName(side.owner))})</div>
      <div class="ct-value">${side.score.toFixed(1)}</div>
    </div>
  `;
}

function renderHighestWeekly(hw) {
  if (!hw || !hw.weeks || !hw.weeks.length) return "";
  const latest = hw.weeks[0];
  const summary = `
    <div class="ct-cat">Highest Weekly Score (Wk ${latest.week}) <span class="credit-pill">+${hw.credits} credit</span> <span class="ct-status locked">🔒 Locked</span></div>
    <div class="ct-split">
      ${hwCell(latest.upper, "U")}
      ${hwCell(latest.lower, "L")}
    </div>
  `;
  const history = hw.weeks.map(wk => `
    <div class="ct-weekly-row">
      <div class="ct-weekly-wk">Week ${wk.week} <span class="ct-status locked">🔒 Locked</span></div>
      <div class="ct-split">
        ${hwCell(wk.upper, "U")}
        ${hwCell(wk.lower, "L")}
      </div>
    </div>
  `).join("");
  return `
    <li class="ct-row ct-weekly">
      ${summary}
      <button class="tier-head" data-toggle="ctweekly" aria-expanded="false">
        <span>Week-by-Week History</span><span class="chev" aria-hidden="true">&#9662;</span>
      </button>
      <div class="tier-body">
        ${history}
      </div>
    </li>
  `;
}

function renderCreditTrackerCard(week) {
  const items = week.creditTracker || [];
  const hw = week.highestWeekly || null;
  if (!items.length && !hw) return "";

  /* Tile preview is derived when statuses exist: how many leads changed hands
     this week, plus the always-locked weekly high. latestChange moves into the
     open body. */
  const withStatus = items.filter(i => i.status);
  const fresh = withStatus.filter(i => i.status === "leading" && i.since === week.weekNumber).length;
  const hwLatest = hw && hw.weeks && hw.weeks[0];
  const preview = withStatus.length
    ? `
      <div class="tile-stats">
        <div><span class="tile-num">${fresh}<span class="tile-of">/${withStatus.length}</span></span><span class="tile-lbl">new leaders</span></div>
        <div><span class="tile-num">${withStatus.length - fresh}</span><span class="tile-lbl">held</span></div>
      </div>
      ${hwLatest ? `<div class="tile-sub">🔒 Wk ${hwLatest.week} high: ${teamOwner(hwLatest.upper)} ${hwLatest.upper.score.toFixed(1)}</div>` : ""}
    `
    : week.latestChange
    ? `
      <div class="news-headline" style="font-size:15px">${esc(week.latestChange)}</div>
      <div class="muted-line tap">Tap for the full credit board.</div>
    `
    : `
      <ul class="ct-preview-list">
        ${[...new Set(items.map(i => i.award.replace(/\s—\s(Upper|Lower)$/, "")))].map(t => `<li>${esc(t)}</li>`).join("")}
      </ul>
    `;

  // Group paired entries by base category — Upper left, Lower right.
  const groups = [];
  const indexOf = {};
  items.forEach(i => {
    const m = i.award.match(/\s—\s(Upper|Lower)$/);
    const base = i.award.replace(/\s—\s(Upper|Lower)$/, "");
    const tier = m && m[1] === "Lower" ? "L" : "U";
    if (!(base in indexOf)) { indexOf[base] = groups.length; groups.push({ base }); }
    groups[indexOf[base]][tier === "U" ? "upper" : "lower"] = Object.assign({ tier }, i);
  });

  const categoryRows = groups.map(g => `
    <li class="ct-row">
      <div class="ct-cat">${esc(g.base)}</div>
      <div class="ct-split">
        ${ctCell(g.upper, week)}
        ${ctCell(g.lower, week)}
      </div>
    </li>
  `).join("");

  const body = `
    ${week.latestChange && withStatus.length ? `<p class="survivor-note">${esc(week.latestChange)}</p>` : ""}
    <p class="ct-legend"><span class="ct-status locked">🔒 Locked</span> final, can't change ·
    <span class="ct-status held">Leader</span> current holder, can change any week</p>
    <ul class="ct-list">
      ${categoryRows}
      ${renderHighestWeekly(hw)}
    </ul>
    <div class="ct-reminder">Reminder: Credits are awarded in the offseason.</div>
  `;
  return cardShell("credittracker", "💳", "Credit Tracker", preview, body);
}

/* --------- ELITE 5 / BRACKET CARD --------- */
function renderElite5Card(week) {
  /* Week 0 has no Elite 5 — the auction recap owns this slot instead. */
  if (week.weekNumber === 0 && week.draftRecap) return renderDraftRecapCard(week);

  if (week.weekNumber >= 14) {
    const preview = `
      <div><span class="strong">Bracket lives here once seeds lock in.</span></div>
      <div class="muted-line tap">Tap to view the current playoff picture.</div>
    `;
    const body = `
      <div class="bracket-placeholder">
        Playoff bracket placeholder — commissioner adds the bracket structure here when relevant.
      </div>
    `;
    return cardShell("bracket", "🏆", "Playoff Bracket", preview, body);
  }

  /* Guard: week.elite5[0] below is a TypeError on an empty array, which would
     blank the whole grid rather than just this card. */
  if (!week.elite5 || !week.elite5.length) return "";

  /* Stat boxes and trait pills are derived from standings + every week's results;
     an authored e.stat string still overrides the stat boxes. */
  const standingsRows = week.upperTier && week.lowerTier
    ? [...week.upperTier.divA, ...week.upperTier.divB, ...week.upperTier.divC, ...week.upperTier.divD, ...week.lowerTier]
    : [];
  const tierOf = e => (e.tier === "U" ? "U" : "L");
  const tierRows = tier => (tier === "U"
    ? [...week.upperTier.divA, ...week.upperTier.divB, ...week.upperTier.divC, ...week.upperTier.divD]
    : week.lowerTier).filter(t => t.team !== GHOST_TEAM);
  const apPct = ap => { const g = ap.w + ap.l + ap.t; return g ? (ap.w + 0.5 * ap.t) / g : 0; };
  const weeklyScores = (team, tier) => {
    const out = [];
    WEEKS.forEach(wk => {
      if (wk.weekNumber < 1 || wk.weekNumber > week.weekNumber) return;
      (wk.results || []).filter(g => g.tier === tier).forEach(g => {
        if (g.teamA === team) out.push(g.scoreA);
        if (g.teamB === team) out.push(g.scoreB);
      });
    });
    return out;
  };
  const traitsFor = (e, t, ap) => {
    const tier = tierOf(e), rows = tierRows(tier), label = tier === "U" ? "Upper" : "Lower";
    const out = [];
    if (t.w > 0 && t.l === 0) out.push(["hot", "Unbeaten"]);
    if (rows.every(r => r.points <= t.points)) out.push(["gold", "Most points · " + label]);
    const best = Math.max.apply(null, rows.map(r => apPct(allPlay(r.team, tier, week.weekNumber))));
    if (ap.w + ap.l + ap.t && apPct(ap) === best) out.push(["gold", "Best vs. field · " + label]);
    const thisWeek = (week.results || []).filter(g => g.tier === tier)
      .flatMap(g => [[g.teamA, g.scoreA], [g.teamB, g.scoreB]]).filter(x => x[0] !== GHOST_TEAM);
    if (thisWeek.length && thisWeek.every(x => x[1] <= (thisWeek.find(y => y[0] === e.team) || [0, -1])[1])) out.push(["hot", "Week high"]);
    const sc = weeklyScores(e.team, tier);
    if (sc.length >= 2 && Math.max.apply(null, sc) - Math.min.apply(null, sc) <= 10) out.push(["cool", "Steady"]);
    const diff = apPct(ap) - winPct(t);
    if (ap.w + ap.l + ap.t && diff >= 0.25) out.push(["cool", "Unlucky"]);
    if (ap.w + ap.l + ap.t && diff <= -0.25) out.push(["warn", "Lucky"]);
    return out.slice(0, 3);
  };
  const eliteStats = e => {
    if (e.stat) return `<div class="elite-stat">${esc(e.stat)}</div>`;
    const t = standingsRows.find(r => r.team === e.team);
    if (!t) return "";
    const ap = allPlay(e.team, tierOf(e), week.weekNumber);
    const hasAp = ap.w + ap.l + ap.t > 0;
    const traits = traitsFor(e, t, ap);
    return `
      <div class="elite-stats">
        <div class="es"><span class="es-v">${t.w}-${t.l}</span><span class="es-l">Record</span></div>
        <div class="es"><span class="es-v">${t.points.toFixed(1)}</span><span class="es-l">Points</span></div>
        ${hasAp ? `<div class="es"><span class="es-v">${ap.w}-${ap.l}</span><span class="es-l">Vs. Field</span></div>` : ""}
      </div>
      ${traits.length ? `<div class="elite-traits">${traits.map(x => `<span class="trait ${x[0]}">${esc(x[1])}</span>`).join("")}</div>` : ""}
    `;
  };
  const preview = `
    <ol class="elite-strip">
      ${week.elite5.map(e => `<li${e.rank === 1 ? ' class="top"' : ""}><span class="es-rank">${e.rank}</span><span>${esc(e.team)}</span></li>`).join("")}
    </ol>
    <div class="muted-line tap">Tap for why — record, points, and how each team fares against the whole field.</div>
  `;

  const body = `
    <div class="elite-list">
      ${week.elite5.map(e => `
        <div class="elite-row ${e.rank === 1 ? "top" : ""}">
          <div class="elite-rank">${e.rank}</div>
          <div class="elite-main">
            <div class="elite-title">
              <span>${esc(e.team)}</span>
              <span class="tier-badge ${e.tier === "U" ? "U" : "L"}">${e.tier === "U" ? "Upper" : "Lower"}</span>
            </div>
            <div class="elite-owner">${esc(shortName(e.owner))}</div>
            ${eliteStats(e)}
            <div class="elite-note">${esc(e.note)}</div>
          </div>
        </div>
      `).join("")}
    </div>
    <p class="ps-foot"><strong>Vs. Field</strong> is the record a team would have if it played every other team in its tier every week. It takes schedule luck out. <strong>Lucky</strong> means the real record is well ahead of Vs. Field, <strong>Unlucky</strong> the reverse. <strong>Steady</strong> means every score so far is within 10 points.</p>
  `;

  return cardShell("elite", "⭐", "Elite 5", preview, body);
}

/* --------- DRAFT RECAP CARD (Week 0 only) --------- */
/* A centered bar: the track's midpoint is market price, an under-market team
   fills left of it, an over-market team fills right. Widths are scaled to the
   tier's own largest deviation, so the bars are comparable within a tier only. */
function marketBar(vsMarket, maxAbs) {
  const w = maxAbs ? (50 * Math.abs(vsMarket) / maxAbs) : 0;
  const left = vsMarket < 0 ? 50 - w : 50;
  const dir = vsMarket < 0 ? "under" : "over";
  return `<span class="track" aria-hidden="true"><span class="zero"></span><span class="bar ${dir}" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%"></span></span>`;
}

function gradeRows(tier) {
  const maxAbs = Math.max.apply(null, tier.grades.map(g => Math.abs(g.vsMarket))) || 1;
  return tier.grades.map(g => {
    const dir = g.vsMarket < 0 ? "under" : "over";
    const amt = (g.vsMarket < 0 ? "−$" : "+$") + Math.abs(g.vsMarket);
    return `
      <div class="grade-row">
        <span class="grade g${esc(g.grade.charAt(0))}">${esc(g.grade)}</span>
        <div class="grade-main">
          <div class="grade-team">${esc(g.team)} <span class="grade-owner">${esc(shortName(g.owner))}</span></div>
          <div class="grade-note">${esc(g.note)}</div>
        </div>
        <div class="grade-mkt">
          ${marketBar(g.vsMarket, maxAbs)}
          <span class="vm ${dir}">${amt}</span>
        </div>
      </div>
    `;
  }).join("");
}

function supTiles(tier) {
  return `
    <div class="sup-grid">
      ${tier.superlatives.map(s => `
        <div class="sup ${esc(s.kind)}">
          <span class="sup-label">${esc(s.label)}</span>
          <div class="sup-subject">${esc(s.subject)}</div>
          <div class="sup-value">${esc(s.value)}</div>
          <div class="sup-team">${esc(s.team)} · ${esc(shortName(s.owner))}</div>
          <p class="sup-note">${esc(s.note)}</p>
        </div>
      `).join("")}
    </div>
  `;
}

/* No accordion here — the tier label, the superlative tiles and the full grade
   board all render inline, so opening the recap card shows every result for
   both tiers in one pass. */
function recapTier(tier) {
  return `
    <div class="tier-block">
      <div class="recap-tier-label">
        ${esc(tier.label)} <span class="recap-tier-sub">${esc(tier.subhead)}</span>
      </div>
      ${supTiles(tier)}
      <div class="grade-legend">
        <span><i class="sw under"></i>Under market</span>
        <span><i class="sw over"></i>Over market</span>
        <span class="grade-legend-note">Curved within tier</span>
      </div>
      ${gradeRows(tier)}
    </div>
  `;
}

function renderDraftRecapCard(week) {
  const d = week.draftRecap;
  const bestU = d.upper.grades[0], bestL = d.lower.grades[0];
  const preview = `
    <div><span class="strong">Upper:</span> ${esc(bestU.grade)} — ${esc(bestU.team)} (${esc(shortName(bestU.owner))})</div>
    <div style="margin-top:4px"><span class="strong">Lower:</span> ${esc(bestL.grade)} — ${esc(bestL.team)} (${esc(shortName(bestL.owner))})</div>
    <div class="muted-line tap">Tap for all 21 grades, the superlatives and the method.</div>
  `;
  const body = `
    <p class="recap-method">${esc(d.method)}</p>
    <ul class="recap-chars">
      ${d.characteristics.map(c => `<li><span class="cnum">${esc(c.stat)}</span><span class="ctxt">${esc(c.text)}</span></li>`).join("")}
    </ul>
    ${recapTier(d.upper)}
    ${recapTier(d.lower)}
  `;
  return cardShell("draftrecap", "🔨", "Draft Recap", preview, body);
}

/* --------- RESULTS CARD --------- */
function fmtScore(n) { return (typeof n === "number") ? n.toFixed(2) : "—"; }

function resultSide(team, owner, score, outcome, right) {
  const ownerLabel = team === GHOST_TEAM ? "Par score" : shortName(owner);
  return `
    <div class="mu-side${right ? " right" : ""} ${outcome}">
      <span class="mu-team">${esc(team)}</span>
      <span class="mu-owner">${esc(ownerLabel)}</span>
      <span class="mu-score">${fmtScore(score)}</span>
    </div>
  `;
}

function renderResultsCard(week) {
  const all = week.results || [];
  if (!all.length) return "";
  const outcome = (mine, theirs) => mine > theirs ? "won" : mine < theirs ? "lost" : "tied";

  /* Tier high scores for the preview. The Ghost is excluded — it can never hold
     a weekly high, and its par score is not a real team's result. */
  const sides = [];
  all.forEach(g => {
    sides.push({ tier: g.tier, team: g.teamA, owner: g.ownerA, score: g.scoreA });
    sides.push({ tier: g.tier, team: g.teamB, owner: g.ownerB, score: g.scoreB });
  });
  const real = sides.filter(s => s.team !== GHOST_TEAM);
  const high = tier => real.filter(s => s.tier === tier).sort((a, b) => b.score - a.score)[0];
  const hu = high("U"), hl = high("L");

  const preview = `
    ${hu ? `<div><span class="strong">Upper high:</span> ${teamOwner(hu)} ${fmtScore(hu.score)}</div>` : ""}
    ${hl ? `<div style="margin-top:4px"><span class="strong">Lower high:</span> ${teamOwner(hl)} ${fmtScore(hl.score)}</div>` : ""}
    <div class="muted-line tap">Tap for all ${all.length} results.</div>
  `;

  const group = (tier, title) => {
    const rows = all.filter(g => g.tier === tier);
    if (!rows.length) return "";
    return tierAccordion(title, `
      <div class="mu-grid">
        ${rows.map(g => {
          /* From Week 3 on a Ghost game renders as an ordinary game. */
          const ghostStyled = g.ghost && week.weekNumber <= 1;
          return `
          <article class="mu result${ghostStyled ? " ghost" : ""}">
            ${g.tag ? `<span class="mu-tag">${esc(g.tag)}</span>` : ""}
            <div class="mu-teams">
              ${resultSide(g.teamA, g.ownerA, g.scoreA, outcome(g.scoreA, g.scoreB), false)}
              <span class="mu-vs">vs</span>
              ${resultSide(g.teamB, g.ownerB, g.scoreB, outcome(g.scoreB, g.scoreA), true)}
            </div>
            ${g.note ? `<p class="mu-note">${esc(g.note)}</p>` : ""}
          </article>
        `;
        }).join("")}
      </div>
    `);
  };

  return cardShell("results", "🏈", weekLabel(week) + " Results", preview,
    group("U", "Upper-Tier") + group("L", "Lower-Tier"));
}

/* --------- HEAD-TO-HEAD (all-time, from matchups-data.js) --------- */
/* window.MATCHUPS_DATA is the same generated file rivalry.html and
   power-rankings.html load (Ghost rows already excluded). If it is missing the
   preview simply renders without the rivalry strip. */
const OWNER_ALIASES = { "jon fetrow / casey trozzo": "jon fetrow" };
const ownerKey = n => { const k = normalizeName(n); return OWNER_ALIASES[k] || k; };
const ROUND_LABEL = { Q: "Quarterfinal", S: "Semifinal", C: "Championship", T: "3rd-place game" };
function headToHead(ownerA, ownerB) {
  const rows = window.MATCHUPS_DATA;
  if (!Array.isArray(rows) || !ownerA || !ownerB || ownerA === "—" || ownerB === "—") return null;
  const A = ownerKey(ownerA), B = ownerKey(ownerB);
  const games = rows.filter(r => {
    const w = ownerKey(r[3]), l = ownerKey(r[5]);
    return (w === A && l === B) || (w === B && l === A);
  }).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const aWins = games.filter(r => ownerKey(r[3]) === A).length;
  const playoffs = games.filter(r => r[7] !== "R");
  const last = games[games.length - 1] || null;
  let streak = 0;
  if (last) {
    const w = ownerKey(last[3]);
    for (let k = games.length - 1; k >= 0 && ownerKey(games[k][3]) === w; k--) streak++;
  }
  return {
    n: games.length, aWins, bWins: games.length - aWins,
    playoffs: playoffs.length, first: games.length ? games[0][0] : null,
    last, streak, streakOwner: last ? (ownerKey(last[3]) === A ? ownerA : ownerB) : null,
    rivalryHref: "rivalry.html#vs=" + encodeURIComponent(A) + "," + encodeURIComponent(B)
  };
}
/* "Joe leads 7–0" / "Tied 12–12" / "First-ever meeting". Null for Ghost games
   or when matchups-data.js is missing. */
function seriesInfo(m) {
  if (m.teamA === GHOST_TEAM || m.teamB === GHOST_TEAM) return null;
  const h = headToHead(m.ownerA, m.ownerB);
  if (!h) return null;
  if (!h.n) return { text: "First-ever meeting", href: null };
  const text = h.aWins === h.bWins
    ? `Tied ${h.aWins}–${h.bWins}`
    : `${shortName(h.aWins > h.bWins ? m.ownerA : m.ownerB)} leads ${Math.max(h.aWins, h.bWins)}–${Math.min(h.aWins, h.bWins)}`;
  return { text, href: h.rivalryHref };
}
function seriesLink(m) {
  const s = seriesInfo(m);
  if (!s) return "";
  return s.href
    ? `<a class="rv-inline" href="${s.href}">⚔️ ${esc(s.text)} →</a>`
    : `<span class="rv-inline plain">⚔️ ${esc(s.text)}</span>`;
}

/* --------- NEXT-WEEK PREVIEW CARD --------- */
/* Featured games (highlight:true) get the full card: records, projected seeds,
   auto tags (division game, unbeaten clash, playoff rematch, first meeting),
   the all-time rivalry strip and the note. Every other game is listed compactly
   under "Rest of the slate" so each owner can find his own game. */
function previewTags(m, week) {
  const tags = [];
  if (m.tag) tags.push(["", m.tag]);
  const rows = week.upperTier && week.lowerTier
    ? [...week.upperTier.divA, ...week.upperTier.divB, ...week.upperTier.divC, ...week.upperTier.divD, ...week.lowerTier] : [];
  const a = rows.find(r => r.team === m.teamA), b = rows.find(r => r.team === m.teamB);
  const dm = divisionMap(week);
  if (m.tier === "U" && dm[m.teamA] && dm[m.teamA] === dm[m.teamB]) tags.push(["div", "Division " + divLetter(dm[m.teamA])]);
  if (a && b && a.w + a.l > 0) {
    if (!a.l && !b.l) tags.push(["hot", "Unbeaten clash"]);
    else if ((!a.l && !b.w) || (!b.l && !a.w)) tags.push(["hot", "Unbeaten vs. winless"]);
  }
  const h = (m.teamA !== GHOST_TEAM && m.teamB !== GHOST_TEAM) ? headToHead(m.ownerA, m.ownerB) : null;
  if (h && h.last && h.last[7] !== "R") tags.push(["rvx", "Playoff rematch"]);
  else if (h && !h.n) tags.push(["rvx", "First meeting"]);
  return tags.slice(0, 2);
}
function renderPreviewCard(week) {
  const all = week.matchupPreviews || [];
  const shown = all.filter(m => m.highlight);
  if (!shown.length) return "";
  const label = "Week " + (week.weekNumber + 1) + " Preview";
  const rows = week.upperTier && week.lowerTier
    ? [...week.upperTier.divA, ...week.upperTier.divB, ...week.upperTier.divC, ...week.upperTier.divD, ...week.lowerTier] : [];
  const played = rows.some(r => r.w + r.l > 0);
  const recOf = team => { const r = rows.find(x => x.team === team); return r && played ? `${r.w}-${r.l}` : ""; };
  const sideMeta = team => {
    if (team === GHOST_TEAM) return recOf(team);
    const rec = recOf(team), seed = played ? seedOf(week, team) : null;
    return [rec, seed ? "#" + seed + " seed" : ""].filter(Boolean).join(" · ");
  };
  const ownerLabel = (team, owner) => team === GHOST_TEAM ? "Par score" : shortName(owner);
  const lead = shown[0];
  const preview = `
    <div><span class="strong">${all.length} games</span> · ${shown.length} featured</div>
    <div class="tile-sub"><span class="strong">Headliner:</span> ${esc(lead.teamA)} vs. ${esc(lead.teamB)}</div>
  `;
  const featured = m => {
    /* Week 0's preview is the Ghost's debut; after that it is an ordinary game. */
    const ghostStyled = m.ghost && week.weekNumber === 0;
    const tags = previewTags(m, week);
    return `
      <article class="mu${ghostStyled ? " ghost" : ""}">
        ${tags.length ? `<div class="mu-tags">${tags.map(t => `<span class="mu-chip ${t[0]}">${esc(t[1])}</span>`).join("")}</div>` : ""}
        <div class="mu-teams">
          <div class="mu-side"><span class="mu-team">${esc(m.teamA)}</span><span class="mu-owner">${esc(ownerLabel(m.teamA, m.ownerA))}</span><span class="mu-meta">${esc(sideMeta(m.teamA))}</span></div>
          <span class="mu-vs">vs</span>
          <div class="mu-side right"><span class="mu-team">${esc(m.teamB)}</span><span class="mu-owner">${esc(ownerLabel(m.teamB, m.ownerB))}</span><span class="mu-meta">${esc(sideMeta(m.teamB))}</span></div>
        </div>
        ${seriesLink(m)}
        <p class="mu-note">${esc(m.note)}</p>
      </article>`;
  };
  const slateRow = m => {
    const s = seriesInfo(m);
    /* The slate keeps the short form; only featured cards say "First-ever meeting". */
    const series = !s ? "" : s.href ? s.text : "First meeting";
    const t = (team, owner) => `<span class="sl-team">${esc(team)}</span> <span class="sl-own">${esc(ownerLabel(team, owner))}${recOf(team) ? " · " + esc(recOf(team)) : ""}</span>`;
    const inner = `
      <div class="sl-teams"><div>${t(m.teamA, m.ownerA)}</div><div class="sl-vs">vs</div><div>${t(m.teamB, m.ownerB)}</div></div>
      ${series ? `<div class="sl-h2h">⚔️ ${esc(series)}${s.href ? " →" : ""}</div>` : ""}`;
    return s && s.href
      ? `<li><a class="sl-row" href="${s.href}">${inner}</a></li>`
      : `<li><div class="sl-row">${inner}</div></li>`;
  };
  const group = (tier, title) => {
    const feat = shown.filter(m => m.tier === tier);
    const rest = all.filter(m => m.tier === tier && !m.highlight);
    if (!feat.length && !rest.length) return "";
    return tierAccordion(title, `
      ${feat.length ? `<div class="mu-grid">${feat.map(featured).join("")}</div>` : ""}
      ${rest.length ? `<div class="sl-head">Rest of the slate</div><ul class="slate">${rest.map(slateRow).join("")}</ul>` : ""}
    `);
  };
  return cardShell("preview", "📅", label, preview, group("U", "Upper-Tier") + group("L", "Lower-Tier"));
}

/* --------- NEWS CARD --------- */
function renderNewsCard(week) {
  const header = `${weekLabel(week)} · ${week.dateString}`;
  const total = newsItems(week).length;

  /* Authoring guardrails — console only, never shown to readers. */
  if (week.weekNumber >= 3) {
    if (total > 6) console.warn(`Week ${week.weekNumber}: ${total} news items (max 6).`);
    if (week.headline && week.headline.length > 120) console.warn(`Week ${week.weekNumber}: headline is ${week.headline.length} chars (max 120).`);
    if (week.subhead && week.subhead.length > 160) console.warn(`Week ${week.weekNumber}: subhead is ${week.subhead.length} chars (max 160).`);
  }

  const subhead = week.subhead ? `<div class="news-subhead">${chipTeams(week.subhead, week)}</div>` : "";
  const preview = `
    <div class="news-headline">${chipTeams(week.headline, week)}</div>
    ${subhead}
    <div class="muted-line tap">Tap for ${total} ${total === 1 ? "story" : "stories"}.</div>
  `;

  /* The preview hides when the card opens, so the body repeats the headline. */
  const body = `
    <div class="news-headline news-lead">${chipTeams(week.headline, week)}</div>
    ${subhead}
    ${newsSections(week).map(s => `
      <div class="news-section">
        ${s.section ? `<div class="news-section-head"><span aria-hidden="true">${esc(s.icon || "")}</span> ${esc(s.section)}</div>` : ""}
        <ul class="news-list">
          ${(s.items || []).map(item => `
            <li><span class="bullet"></span><span>${chipTeams(item, week)}</span></li>
          `).join("")}
        </ul>
      </div>
    `).join("")}
  `;

  return cardShell("news", "📰", header, preview, body);
}

/* Upper/Lower accordion used inside Results, Preview and Post-Season. Same
   markup as Standings: starts collapsed, each tier opens independently. */
function tierAccordion(title, inner) {
  if (!inner) return "";
  return `
    <div class="tier-block">
      <button class="tier-head" data-toggle="tier" aria-expanded="false">
        <span>${esc(title)}</span><span class="chev" aria-hidden="true">&#9662;</span>
      </button>
      <div class="tier-body">${inner}</div>
    </div>`;
}

/* --------- CARD SHELL --------- */
/* News, Elite 5 and the Week 0 Draft Recap span the full row; every other card
   is a half-width tile. */
const FULL_WIDTH_CARDS = ["news", "elite", "draftrecap", "bracket"];
function cardShell(id, icon, title, previewHtml, bodyHtml, alwaysCollapsed) {
  const span = FULL_WIDTH_CARDS.includes(id) ? " span-2" : " tile";
  return `
    <article class="pulse-card${span}" data-card="${id}" tabindex="0" role="button" aria-expanded="false">
      <div class="card-head">
        <div class="left">
          <span class="card-icon" aria-hidden="true">${icon}</span>
          <h3 class="card-title">${esc(title)}</h3>
        </div>
        ${alwaysCollapsed ? "" : '<span class="card-chev" aria-hidden="true">&#9662;</span>'}
      </div>
      <div class="card-preview">${previewHtml}</div>
      ${alwaysCollapsed ? "" : `<div class="card-body">${bodyHtml}</div>`}
    </article>
  `;
}

/* --------- WIRING: CARDS (one-at-a-time expand) --------- */
function wireCards() {
  const grid = document.getElementById("cardGrid");
  if (!grid) return;
  const cards = grid.querySelectorAll(".pulse-card");

  cards.forEach(card => {
    const body = card.querySelector(".card-body");
    if (!body) return;

    const toggle = (e) => {
      if (card.classList.contains("open")) {
        if (e.target.closest(".card-head") || e.target === card) {
          closeAll();
        }
        return;
      }
      openOnly(card);
    };

    card.addEventListener("click", (e) => {
      if (e.target.closest("[data-toggle]")) return;
      toggle(e);
    });
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle(e);
      }
      if (e.key === "Escape" && card.classList.contains("open")) {
        closeAll();
      }
    });
  });

  function openOnly(target) {
    cards.forEach(c => {
      if (c === target) {
        c.classList.add("open");
        c.classList.remove("dim");
        c.setAttribute("aria-expanded", "true");
      } else {
        c.classList.remove("open");
        c.classList.add("dim");
        c.setAttribute("aria-expanded", "false");
      }
    });
    /* A half-width tile jumps to a full row when it opens, so bring its top
       back into view (scroll-margin-top clears the sticky header). */
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }
    catch (_) { target.scrollIntoView(); }
  }
  function closeAll() {
    cards.forEach(c => {
      c.classList.remove("open", "dim");
      c.setAttribute("aria-expanded", "false");
    });
  }
}

/* --------- WIRING: STANDINGS COLLAPSIBLES --------- */
function wireStandingsCollapsibles() {
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", expanded ? "false" : "true");
    });
  });
}

/* --------- WEEK PICKER --------- */
function renderWeekPicker(activeWeek) {
  const list = document.getElementById("weekPickerList");
  const label = document.getElementById("weekPillLabel");
  label.textContent = weekLabel(activeWeek);

  list.innerHTML = WEEKS.map(w => `
    <li>
      <button data-week="${w.weekNumber}" aria-current="${w.weekNumber === activeWeek.weekNumber ? "true" : "false"}" role="option">
        <span>${esc(weekLabel(w))}</span>
        <span class="meta">${esc(w.dateString)}</span>
      </button>
    </li>
  `).join("");

  list.querySelectorAll("button[data-week]").forEach(b => {
    b.addEventListener("click", () => {
      const n = parseInt(b.getAttribute("data-week"), 10);
      const target = findWeek(n);
      if (!target) return;
      const url = new URL(window.location.href);
      url.searchParams.set("week", String(n));
      window.history.pushState({}, "", url);
      closeWeekPicker();
      renderPage(target);
      renderWeekPicker(target);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function openWeekPicker() {
  document.getElementById("weekPicker").classList.add("open");
  document.getElementById("weekPill").setAttribute("aria-expanded", "true");
}
function closeWeekPicker() {
  document.getElementById("weekPicker").classList.remove("open");
  document.getElementById("weekPill").setAttribute("aria-expanded", "false");
}

/* --------- PLACEHOLDER STATES (preseason / offseason) --------- */
const INTERSTITIAL_COPY = {
  preseason: {
    head: "See you at the draft.",
    sub: `Weekly Pulse goes live once the ${SEASON} season kicks off. Draft Day is Labor Day, Monday, September 7 — check back after the auctions.`,
    cta: "Draft Day Details &rarr;",
    href: "draftday.html"
  },
  offseason: {
    head: "Weekly Pulse is dark until kickoff.",
    sub: `The ${SEASON} season is in the books. Check out the year-end content while you wait for September.`,
    cta: `View ${SEASON} Power Rankings &rarr;`,
    href: "power-rankings.html"
  }
};
function renderInterstitial() {
  const copy = INTERSTITIAL_COPY[PULSE_STATE] || INTERSTITIAL_COPY.offseason;
  const main = document.getElementById("pulseMain");
  document.getElementById("weekBar").style.display = "none";
  main.innerHTML = `
    <section class="offseason-card">
      <h2 class="offseason-head">${copy.head}</h2>
      <p class="offseason-sub">${copy.sub}</p>
      <a class="offseason-cta" href="${copy.href}">${copy.cta}</a>
    </section>
  `;
}

/* --------- BOOT --------- */
(function init() {
  // Hamburger nav
  const btn = document.getElementById("navToggle");
  const nav = document.getElementById("primaryNav");
  btn.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
  });

  // Off-season short-circuit
  if (PULSE_STATE !== "live" || WEEKS.length === 0) {
    renderInterstitial();
    return;
  }

  // Week picker toggle
  const pill = document.getElementById("weekPill");
  pill.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = document.getElementById("weekPicker").classList.contains("open");
    open ? closeWeekPicker() : openWeekPicker();
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#weekPicker") && !e.target.closest("#weekPill")) {
      closeWeekPicker();
    }
  });

  // Back/forward URL navigation
  window.addEventListener("popstate", () => {
    const n = getWeekFromUrl();
    const target = (n !== null && findWeek(n)) || WEEKS[0];
    renderPage(target);
    renderWeekPicker(target);
  });

  // Initial render
  const urlWeek = getWeekFromUrl();
  const activeWeek = (urlWeek !== null && findWeek(urlWeek)) || WEEKS[0];
  renderPage(activeWeek);
  renderWeekPicker(activeWeek);
})();
</script>
